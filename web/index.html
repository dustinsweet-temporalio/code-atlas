<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b59c3'/%3E%3Cpath d='M7 21l9-12 9 12z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link id="hljs-theme" rel="stylesheet" href="vendor/github.min.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">Code Atlas</div>

    <h2><label for="repo-select">Index</label></h2>
    <select id="repo-select"><option value="">Loading…</option></select>
    <div id="repo-meta" class="muted"></div>
    <button id="new-chat" class="primary" disabled title="Select an index first">+ New chat</button>

    <h2>Conversations</h2>
    <ul id="conversations"></ul>

    <div class="sidebar-foot">
      <a id="temporal-ui-link" class="temporal-link" href="http://localhost:8233" target="_blank" rel="noopener noreferrer"
         title="Indexing runs as Temporal workflows (sync-&lt;index&gt;)">Temporal UI ↗</a>
      <button id="docs-status" class="docs-status checking" type="button" title="Checking the Temporal Docs MCP…">
        <span class="dot" aria-hidden="true"></span><span id="docs-status-text">Temporal Docs MCP</span>
      </button>
      <div id="status" class="muted"></div>
    </div>
  </aside>

  <main>
    <div id="banner" hidden></div>
    <header id="chat-header" hidden>
      <span class="label">Index</span>
      <strong id="chat-repo"></strong>
      <span id="chat-repo-meta" class="muted"></span>
      <span class="spacer"></span>
      <span id="report-actions" class="report-actions" hidden>
        <span class="seg" role="group" aria-label="Report view">
          <button id="report-summary" type="button" class="ghost" aria-pressed="true">Summary</button>
          <button id="report-detailed" type="button" class="ghost" aria-pressed="false" title="The complete report: every fact, score, design, source and the method">Detailed report</button>
        </span>
        <button id="report-download" type="button" class="ghost">Download</button>
      </span>
      <button id="compass-open" type="button" class="ghost" title="Open this index's database in Compass Web (summaries, lenses, reports)">Open in Compass</button>
      <button id="report-toggle" type="button" class="ghost">Temporal report</button>
    </header>
    <section id="report-view" hidden></section>
    <div id="messages" aria-live="polite"></div>
    <form id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Ask about this repository…" autofocus></textarea>
      <button id="send" type="submit" class="primary">Send</button>
      <button id="stop" type="button" hidden>Stop</button>
    </form>
  </main>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="report.js"></script>
  <script src="app.js"></script>
</body>
</html>
