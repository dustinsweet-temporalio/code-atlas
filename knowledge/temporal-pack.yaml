  - id: S-PY-GEVENT
    k: sdk
    t: Temporal Python worker running in a gevent-patched process
    s: 'gevent is a known incompatibility: gevent.monkey.patch_all() can break asyncio event loops, including Temporal''s. Avoid gevent in worker processes. If that is impossible, follow the samples-python gevent_async sample, which uses a custom gevent executor.'
