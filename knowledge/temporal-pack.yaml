    tmp.local_act: "Local Activity"
    tmp.side_effect: "SideEffect / MutableSideEffect"
    tmp.schedule: "Schedule API"
    tmp.cron_wf: "Cron Workflow (cron schedule option)"
    tmp.saga: "Compensation bookkeeping in workflow"
    tmp.heartbeat: "Activity heartbeat"
    tmp.act_options: "Activity options (timeouts, retry, task queue)"
    tmp.retry_policy: "RetryPolicy configured"
    tmp.wf_options: "Workflow start options (IDs, timeouts, retry, reuse policy)"
    tmp.dc: "Data converter / payload codec"
