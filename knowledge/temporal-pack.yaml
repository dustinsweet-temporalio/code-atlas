# Temporal knowledge pack
#
# The single source of Temporal knowledge for the Temporal lens (indexing) and
# the suitability report. Nothing about Temporal may be asserted in a report
# unless it traces to an entry here (by id) or to a Temporal Docs MCP result
# fetched in the same run.
#
# Entry keys
#   id    stable identifier, cited in lens records and reports
#   k     kind: gate | value | pattern | limit | conv (conversion signal in
#         non-Temporal code) | check (review item for existing Temporal code) |
#         sdk | question
#   t     title, at most 12 words (this is all the slim view carries)
#   s     statement, at most 40 words
#   on    lens signal codes that make the entry relevant (see `signals`)
#   mode  conv (converting non-Temporal code) | eval (reviewing Temporal code) | both
#   sdk   [all] unless SDK-specific
#   src   SOURCE:page or SOURCE:file
#   url   Temporal docs/blog URLs confirmed through the Docs MCP
#   v     verified (MCP confirms) | pending | guide-only (internal guidance, no
#         docs page) | conflict (sources disagree; see note) | stale (superseded)
#   ts    true when time-sensitive (dates, preview status, numeric limits)
#   note  verification or conflict detail

meta:
  id: temporal-lens-pack
  version: 0.1.0
  built: 2026-10-16
  sources:
    DOCS: {title: "Temporal Docs MCP (temporal.mcp.kapa.ai)", authority: 1}
    CRN: {title: "Notes for Code Reviews (DSE, internal)", authority: 2}
    BPG: {title: "SA Workflow Design & Best Practices Guide (internal)", authority: 2}
    RUN: {title: "SA Customer Evaluation Runbook (internal)", authority: 2}
    SKL: {title: "temporal-developer skill v0.5.0 (synced 2026-09-19)", authority: 3}
    DER: {title: "Derived heuristic (pack author); not a Temporal fact, never cite as one", authority: 4}
  precedence: "DOCS > CRN > BPG = RUN > SKL > DER. On conflict the higher authority wins and the entry is marked conflict with a note. Time-sensitive guide claims are re-verified against DOCS at every pack build."
  verification:
    date: 2026-10-16
    method: "Each non-SDK entry checked against Temporal Docs MCP search results; 'revise' outcomes replaced the statement and kept the original in note."
    core_entries: {verified: 183, guide-only: 8}
    sdk_specific: {verified: 130, guide-only: 2, conflict: 5}
    conflicts_note: "Conflict entries contradict the docs (the skill's claim is wrong) and are excluded from lens prompt views and reports until rewritten: S-PY-NONRETRYABLE-IN-WORKFLOW, S-RB-NONRETRYABLE-IN-WORKFLOW, S-PY-PATCHED-LOOP, S-TS-PATCHED-MEMOIZE, S-JAVA-SPRING-COMPONENT."
    stale_in_sources:
      - "BPG:22 Worker Versioning 'do not recommend yet' (now GA and the docs' default)"
      - "BPG:14-15 vs CRN:18 signal rate: docs support about 5/s per execution; CRN's 50 RPS unsupported"
      - "BPG:19 Start Delay 'experimental' (no longer labelled)"
      - "SKL Standalone Activities 'Public Preview' (docs: GA; also Ruby and Rust, not PHP)"
      - "SKL Rust SDK 'Public Preview' (docs: v1.1.0, no preview label)"
      - "SKL/BPG SDK list omits PHP (docs: eight official SDKs)"
      - "CRN:4 deadlock detector 5 s for Python/TS/.NET (docs: about 1-2 s; Go/Java 1 s)"

# ---------------------------------------------------------------------------
# Lens signal vocabulary. Closed set: the index model may only emit these codes
# (with an optional ':detail' suffix, e.g. effect.http:stripe).
# ---------------------------------------------------------------------------
signals:
  trigger:
    trigger.http: "Inbound HTTP/RPC handler starts the work"
    trigger.queue: "Consumes from a queue/stream/topic"
    trigger.cron: "Started by cron, scheduler library, or periodic loop"
    trigger.cli: "Started from a CLI, script, or batch entry point"
    trigger.event: "Webhook, callback, or event listener starts the work"
  effect:
    effect.http: "Outbound call to an external API or service"
    effect.db_write: "Writes to a database or durable store"
    effect.payment: "Moves money or calls a payment provider"
    effect.notify: "Sends email, SMS, push, or chat message"
    effect.file: "Reads/writes files or object storage"
    effect.llm: "Calls an LLM or AI model"
    effect.infra: "Provisions or mutates infrastructure/cloud resources"
    effect.publish: "Publishes to a message bus/topic"
  read:
    read.only_sync: "Synchronous request that only reads (no writes, no waits)"
  wait:
    wait.sleep: "Sleeps or delays inside a process"
    wait.poll: "Loops checking external state until done"
    wait.human: "Waits for a person (approval, review, input)"
    wait.external: "Waits for an external callback/event correlated to earlier work"
    wait.long: "Work spans hours, days, or longer"
  reliab:
    reliab.retry: "Hand-rolled retry or backoff"
    reliab.compensation: "Hand-rolled undo/rollback of earlier steps"
    reliab.idempotency: "Idempotency keys, dedupe tables, check-before-act"
