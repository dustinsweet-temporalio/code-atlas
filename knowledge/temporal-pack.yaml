  - id: S-PY-PASSTHROUGH
    k: sdk
    t: Activities and third-party libs not imported through imports_passed_through
    s: The sandbox re-imports the workflow file and its non-passthrough imports on every workflow run and replay. Import activities, models and third-party modules inside workflow.unsafe.imports_passed_through(). The opt-in WARN_ON_UNINTENTIONAL_PASSTHROUGH policy flags missed imports.
