    k: sdk
    t: Sync activities registered without an activity_executor
    s: Sync (def) activities are the recommended default but require Worker(activity_executor=...), and ThreadPoolExecutor is recommended. ProcessPoolExecutor activities need a shared_state_manager, must be picklable, and are not interrupted on cancellation.
