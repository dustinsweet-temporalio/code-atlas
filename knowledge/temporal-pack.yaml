    - DOCS
    v: verified
    note: The worker option unsafe_workflow_io_enabled is also an escape hatch. Docs prefer Unsafe.io_enabled blocks over it.
    url:
    - https://ruby.temporal.io/Temporalio/Workflow/Unsafe.html#class_method_details
    - https://ruby.temporal.io/#Advanced_Workflow_Safety_and_Escaping
  - id: S-RB-WORKFLOW-EXCEPTION
    k: sdk
    t: Non-ApplicationError exceptions only fail the workflow task
    s: Only Temporalio::Error::Failure exceptions (raise ApplicationError explicitly) or Timeout::Error fail a Ruby workflow. Others fail the workflow task, which retries. Configure workflow_failure_exception_types (worker) or workflow_failure_exception_type (workflow), including NondeterminismError to fail fast.
    detect: raise of StandardError subclasses in Workflow::Definition code; absence of workflow_failure_exception_types on Worker.new and workflow_failure_exception_type on the workflow class
    mode: both
    sdk:
    - ruby
    src:
    - SKL:ruby/error-handling.md
    - SKL:ruby/advanced-features.md
    - DOCS
    v: verified
    note: 'Activity, child and cancellation errors are Failures and also fail the workflow. The docs do not give the [Exception]-in-tests advice. Revised from: Only Temporalio::Error::ApplicationError fails a Ruby workflow; other exceptions fail the task, which retries. Configure workflow_failure_exception_types, including NondeterminismError to fail fast; use [Exception] in tests.'
    url:
    - https://ruby.temporal.io/#Workflow_Exceptions
    - https://docs.temporal.io/references/failures#application-failure
  - id: S-RB-NONRETRYABLE-IN-WORKFLOW
    k: sdk
    t: non_retryable ApplicationError raised from workflow code
    s: 'non_retryable: true belongs on ApplicationError raised in activities, where any Ruby exception is otherwise converted to a retryable ApplicationError. Do not use it inside workflows.'
    detect: 'Temporalio::Error::ApplicationError.new(..., non_retryable: true) inside Workflow::Definition classes'
    mode: eval
    sdk:
    - ruby
    src:
    - SKL:ruby/error-handling.md
    - DOCS
    v: conflict
    note: Docs say non_retryable on a workflow-thrown Application Failure stops workflow retries regardless of Retry Policy, so it has an effect in workflows.
    url:
    - https://docs.temporal.io/references/failures#non-retryable
  - id: S-RB-ACTIVITYERROR-CANCEL
    k: sdk
    t: Rescuing ActivityError without re-raising cancellation
    s: Activity failures surface as Temporalio::Error::ActivityError. Re-raise when Temporalio::Error.canceled?(e) so the workflow is cancelled rather than failed.
    detect: rescue Temporalio::Error::ActivityError or rescue StandardError around execute_activity without Temporalio::Error.canceled? check
    mode: eval
    sdk:
    - ruby
    src:
    - SKL:ruby/error-handling.md
    - DOCS
    v: verified
    url:
    - https://docs.temporal.io/develop/ruby/workflows/cancellation
    - https://ruby.temporal.io/Temporalio/Workflow.html#execute_activity-class_method
  - id: S-RB-CANCEL-CLEANUP
    k: sdk
    t: Cleanup activities in ensure not using a detached cancellation
    s: After workflow cancellation, cleanup in ensure is cancelled too unless the activity gets a detached cancellation from Temporalio::Cancellation.new passed as cancellation:.
    detect: 'execute_activity in ensure blocks without cancellation: argument'
    mode: both
    sdk:
    - ruby
    src:
    - SKL:ruby/gotchas.md
    - DOCS
    v: verified
    url:
    - https://docs.temporal.io/develop/ruby/workflows/cancellation
    - https://ruby.temporal.io/#Workflow_Fiber_Scheduling_and_Cancellation
  - id: S-RB-ACTIVITY-CANCEL
    k: sdk
    t: Ruby activities ignoring cancellation block worker shutdown
    s: Server-side cancellation reaches activities only through Temporalio::Activity::Context.current.heartbeat and is raised as Temporalio::Error::CanceledError. Activities that ignore cancellation can block worker shutdown indefinitely. graceful_shutdown_period defaults to 0.
    detect: long loops in Activity::Definition without Context.current.heartbeat; rescue blocks swallowing Temporalio::Error::CanceledError
    mode: eval
    sdk:
    - ruby
    src:
    - SKL:ruby/gotchas.md
    - SKL:ruby/advanced-features.md
    - DOCS
    v: verified
    note: 'The class is CanceledError (one L), not CancelledError. Worker-shutdown cancellation does not require heartbeating. Revised from: Activities see cancellation only via Temporalio::Activity::Context.current.heartbeat, raising Temporalio::Error::CancelledError. Activities ignoring cancellation can block worker shutdown indefinitely; graceful_shutdown_period defaults to 0.'
    url:
    - https://ruby.temporal.io/#Activity_Heartbeating_and_Cancellation
    - https://ruby.temporal.io/#Activity_Worker_Shutdown
  - id: S-RB-LOGGING
    k: sdk
    t: puts, print or Logger used inside workflows
    s: Use Temporalio::Workflow.logger, which skips logging during replay, instead of puts or a self-created Logger. Logger is on the default illegal call list. Guard other replay-sensitive side effects with Temporalio::Workflow::Unsafe.replaying?, never business logic.
    detect: puts, print, p(, Logger.new, Rails.logger in Workflow::Definition classes
    mode: both
    sdk:
    - ruby
    src:
    - SKL:ruby/determinism.md
    - SKL:ruby/observability.md
    - SKL:ruby/gotchas.md
    - DOCS
    v: verified
    note: 'Logger.new is illegal (it raises), not just a source of duplicate output. Revised from: puts, print and Logger.new produce duplicate output on replay. Use Temporalio::Workflow.logger; guard other side effects with unless Temporalio::Workflow::Unsafe.replaying?.'
    url:
    - https://docs.temporal.io/develop/ruby/workflows/basics#workflow-logic-requirements
  - id: S-RB-ACTIVERECORD
    k: sdk
    t: ActiveRecord models passed to workflows or activities
    s: Don't reuse ActiveRecord or ORM models as Temporal arguments. Use workflow-specific models, such as ActiveModel with JSON additions. Default JSON conversion returns hashes with string keys. Arg hints help only custom converters; the default converter ignores them.
    detect: Model.find(...) or AR instances passed to execute_workflow/start_workflow/execute_activity; symbol-key hash access on workflow inputs
    mode: both
    sdk:
    - ruby
    src:
    - SKL:ruby/advanced-features.md
    - SKL:ruby/data-handling.md
    - DOCS
    v: verified
    note: 'Revised from: Never pass ActiveRecord objects as Temporal arguments; serialize to plain hashes or dedicated model classes. Symbol keys come back as strings, so use workflow_arg_hint and arg_hints for typed deserialization.'
    url:
    - https://docs.temporal.io/develop/ruby/best-practices/data-handling/data-conversion#supported-data-types
    - https://ruby.temporal.io/#Converter_Hints
  - id: S-RB-ZEITWERK
    k: sdk
    t: Rails autoloading causes I/O during workflow replay
    s: Zeitwerk autoloading can perform file I/O mid-replay. Enable config.eager_load or explicitly require all workflows, activities and dependencies before starting the worker.
    detect: Rails worker entrypoints without eager_load or explicit require of workflow/activity files before Temporalio::Worker.new
    mode: both
    sdk:
    - ruby
    src:
    - SKL:ruby/advanced-features.md
    - DOCS
    v: verified
    note: Docs say this affects non-production environments only, because production eager-loads by default.
    url:
    - https://docs.temporal.io/develop/ruby/integrations/rails-integration
  - id: S-RB-FORK
    k: sdk
    t: Temporal client or worker created before process fork
    s: Temporal Ruby SDK runtimes, clients and workers cannot be used across forks. With forking servers like Puma or Unicorn, create them only inside the forked child. Reusing objects created in the parent raises an exception.
    detect: Temporalio::Client.connect or Worker.new in Puma/Unicorn config or initializers executed before fork
    mode: both
    sdk:
    - ruby
    src:
    - SKL:ruby/advanced-features.md
    - DOCS
    v: verified
    note: 'Docs do not name a specific hook such as before_worker_boot. Revised from: With forking servers like Puma or Unicorn, connections made before fork are unsafe to share. Create the Temporal client and worker after fork, for example in before_worker_boot.'
    url:
    - https://ruby.temporal.io/#Forking
  - id: S-RB-WORKFLOW-INIT
    k: sdk
    t: Workflow state not initialized before handlers run
    s: Signal and update handlers can run before execute, for example with signal-with-start. Put workflow_init above initialize to receive workflow args; parameters must match execute and it cannot block.
    detect: instance variables first set in execute but read in workflow_signal/workflow_update handlers; workflow_init initialize signature mismatch
    mode: both
    sdk:
    - ruby
    src:
    - SKL:ruby/advanced-features.md
    - DOCS
    v: verified
    url:
    - https://docs.temporal.io/develop/ruby/workflows/message-passing#use-workflow_init-to-access-input-early
    - https://docs.temporal.io/handling-messages
  - id: S-RB-PATCHED-LOOP
    k: sdk
    t: Temporalio::Workflow.patched is memoized and unsafe in loops
    s: Ruby memoizes patched() per patch ID, so inside a loop it returns the same value each iteration. Use per-iteration IDs like 'my-change-#{i}'; lifecycle is patched, deprecate_patch, removal.
    detect: Temporalio::Workflow.patched( with a constant ID inside each, times, loop or while blocks
    mode: eval
    sdk:
    - ruby
    src:
    - SKL:ruby/versioning.md
    - DOCS
    v: guide-only
    note: rubydoc confirms patched results are memoized per ID and the deprecate_patch lifecycle. Docs do not call loops unsafe or recommend per-iteration IDs.
    url:
    - https://ruby.temporal.io/Temporalio/Workflow.html#patched-class_method
  - id: S-RB-TIMEOUT-UNITS
    k: sdk
    t: Ruby activity timeouts are numeric seconds
    s: All Ruby SDK timeout and interval values, such as start_to_close_timeout and heartbeat_timeout, are numeric seconds; check unit conversions when porting code expressed in milliseconds or durations.
    detect: 'start_to_close_timeout:, schedule_to_close_timeout:, heartbeat_timeout: with millisecond-sized literals or ActiveSupport durations'
    mode: both
    sdk:
    - ruby
    src:
    - SKL:ruby/error-handling.md
    - DOCS
    v: verified
    url:
    - https://ruby.temporal.io/Temporalio/Workflow.html#execute_activity-class_method
    - https://docs.temporal.io/develop/ruby/activities/timeouts
  - id: S-RB-TESTING
    k: sdk
    t: Ruby test environment, mocking and replay conventions
    s: Use WorkflowEnvironment.start_local, start_time_skipping only for timers, fake activities with matching activity_name, ActivityEnvironment for activities, WorkflowReplayer for histories, and SecureRandom.uuid IDs and task queues.
    detect: temporalio/testing requires; fake activities without activity_name; hardcoded task queues; no WorkflowReplayer tests
    mode: eval
    sdk:
    - ruby
    src:
    - SKL:ruby/testing.md
    - DOCS
    v: verified
    note: The exact WorkflowReplayer class name was not in the retrieved chunks. The docs do have a Replay tests section.
    url:
    - https://docs.temporal.io/develop/ruby/best-practices/testing-suite
    - https://docs.temporal.io/develop/ruby/best-practices/testing-suite#testing-workflows-with-time-skipping
  - id: S-RS-RECOGNIZE
    k: sdk
    t: Recognizing Rust workflow, activity, worker and client code
    s: 'Workflows are #[workflow] structs with #[workflow_methods] impls containing #[run] and optional #[init]; activities are #[activity] methods in #[activities] impls; workers use temporalio_sdk::Worker; clients use temporalio_client.'
    detect: 'temporalio_macros, temporalio_sdk, temporalio_client, temporalio_sdk_core imports; #[workflow], #[workflow_methods], #[run], #[signal], #[query], #[update], #[activities], #[activity]'
    mode: both
    sdk:
    - rust
    src:
    - SKL:rust/rust.md
    - DOCS
    v: verified
    note: 1.0 code also imports temporalio_common and temporalio_workflow. temporalio_sdk_core types are no longer re-exported by the SDK.
    url:
    - https://docs.temporal.io/develop/rust/workflows/basics#develop-workflows
    - https://docs.temporal.io/develop/rust/quickstart#run-hello-world-test-your-installation
  - id: S-RS-IO-IN-WORKFLOW
    k: sdk
    t: I/O and nondeterministic calls inside Rust workflow methods
    s: 'Network, database, filesystem, process calls, system time and other side effects belong in #[activity] methods, never in #[workflow_methods] code.'
    detect: 'reqwest, tokio::fs, std::fs, std::process, SystemTime::now, Instant::now, sqlx inside #[workflow_methods] impls'
    mode: both
    sdk:
    - rust
    src:
    - SKL:rust/rust.md
    - DOCS
    v: verified
    url:
    - https://docs.temporal.io/develop/rust/workflows/basics#workflow-logic-requirements
    - https://github.com/temporalio/sdk-rust/blob/main/crates/sdk/README.md
  - id: S-RS-CLIENT-IN-WORKFLOW
    k: sdk
    t: Temporal Client created or used inside workflow code
    s: Do not create or use a Temporal Client inside workflows; use it from starters or, when needed, inside activities.
    detect: 'Client::new, Connection::connect or client handles referenced inside #[workflow_methods] impls'
    mode: both
    sdk:
    - rust
    src:
    - SKL:rust/rust.md
    - DOCS
    v: verified
    url:
    - https://docs.temporal.io/develop/rust/client/temporal-client
  - id: S-RS-WORKER-CONCERNS
    k: sdk
    t: Runtime, secrets and config mixed into workflow code
    s: temporalio_sdk::Runtime setup, Client connections, secrets and environment config belong in the worker process, not workflow code. The quickstart keeps workflows.rs, activities.rs and main.rs separate, which makes the determinism boundary visible.
    detect: 'std::env::var, Runtime::from_current_tokio, Connection::connect, ClientOptions::load_from_config or secrets access inside #[workflow_methods] impls'
    mode: both
    sdk:
    - rust
    src:
    - SKL:rust/rust.md
    - DOCS
    v: verified
    note: '1.0 uses the SDK-owned Runtime, not CoreRuntime. The file layout is a quickstart convention, not a rule, so ''one file'' was dropped from detect. Revised from: CoreRuntime setup, clients, secrets, environment config and external logging sinks belong in the worker process, not workflows. Keep workflows.rs, activities.rs and main.rs separate to expose the determinism boundary.'
    url:
    - https://docs.temporal.io/develop/rust/workers/worker-process
    - https://github.com/temporalio/sdk-rust/blob/main/CHANGELOG.md
  - id: S-RS-REGISTRATION
    k: sdk
    t: Workers on one task queue registering different types
    s: All workers polling the same task queue should register the same workflow and activity types via WorkerOptions register_workflow and register_activities.
    detect: multiple WorkerOptions::new('same-queue') with differing register_workflow or register_activities calls
    mode: eval
    sdk:
    - rust
    src:
    - SKL:rust/rust.md
    - DOCS
    v: verified
    note: 'Exact API: WorkerOptions::new(queue).register_workflow::<T>()? and .register_activities(instance).'
    url:
    - https://docs.temporal.io/develop/rust/workers/worker-process
  - id: S-RS-PREVIEW
    k: sdk
    t: Rust SDK is stable 1.x; some APIs experimental
    s: The Rust SDK is a stable 1.x release (temporalio-sdk 1.0.0 in Sept 2026, 1.1.0 in Oct 2026) with no preview label. Some APIs remain behind the experimental feature. Verify crate versions and APIs against docs.rs.
    detect: temporalio-sdk, temporalio-client crate versions in Cargo.toml; use of the experimental feature
    mode: eval
    sdk:
    - rust
    src:
    - SKL:rust/rust.md
    - DOCS
    v: verified
    note: 'Confirms stale. CHANGELOG lists 1.0.0 (2026-09-04) and 1.1.0 (2026-10-06); docs pages are written against 1.0.0. Revised from: The Rust SDK is in Public Preview and under active development; verify crate versions and method names against docs.rs and sdk-rust examples before relying on exact APIs.'
    url:
    - https://github.com/temporalio/sdk-rust/blob/main/CHANGELOG.md
    - https://docs.temporal.io/develop/rust/workers/worker-process
    ts: true

