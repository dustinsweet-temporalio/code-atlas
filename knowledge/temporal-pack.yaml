  - id: S-PY-SLEEP
    k: sdk
    t: asyncio.sleep or time.sleep instead of workflow.sleep
    s: time.sleep is not durable and blocks the workflow. Use await workflow.sleep(timedelta(...)) or asyncio.sleep(...). In Python workflows both create durable Temporal timers recorded in history.
    detect: time.sleep( inside @workflow.defn classes
