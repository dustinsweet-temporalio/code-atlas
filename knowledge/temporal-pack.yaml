  data:
    data.large: "Large payloads/blobs passed between steps"
    data.stream: "High-volume streaming/data-plane processing"
  constraint:
    latency.hard: "Hard low-latency path (milliseconds matter)"
    rate.limit: "Rate limiting or throttling toward a dependency"
    flaky.api: "Dependency known or treated as unreliable"
    tenant.multi: "Multi-tenant workload sharing capacity"
  hazard:
    hazard.time: "Reads wall-clock time"
    hazard.random: "Random numbers or UUIDs"
    hazard.env: "Reads env vars, config services, or mutable globals"
    hazard.io: "Network/file/DB I/O"
    hazard.thread: "Native threads or non-deterministic concurrency"
    hazard.iter_order: "Iterates unordered maps/sets"
  temporal:
    tmp.wf_def: "Temporal Workflow definition"
    tmp.act_def: "Temporal Activity definition"
    tmp.worker: "Worker setup/registration"
    tmp.client: "Temporal Client usage (start/signal/query/update)"
    tmp.signal: "Signal handler or send"
    tmp.query: "Query handler"
    tmp.update: "Update handler/validator"
    tmp.child: "Child Workflow"
    tmp.can: "Continue-As-New"
    tmp.timer: "Workflow timer/sleep"
