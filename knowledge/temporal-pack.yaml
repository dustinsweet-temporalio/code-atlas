# ---------------------------------------------------------------------------
# Review checks for EXISTING Temporal code (evaluation mode).
# ---------------------------------------------------------------------------
  url: ["https://docs.temporal.io/evaluate/why-temporal#why-temporal", "https://docs.temporal.io/design-patterns/fairness"]
checks:
# Inputs / outputs
- {id: E-IO-OBJPARAM, k: check, t: "Use a single object parameter for workflows/activities/signals", s: "Objects as parameters let fields change without breaking signatures; changing positional parameters breaks compatibility.", on: [tmp.wf_def, tmp.act_def], mode: eval, sdk: [all], src: ["CRN:3", DOCS], v: verified, url: ["https://docs.temporal.io/workflow-definition#workflow-parameters", "https://docs.temporal.io/develop/python/activities/basics#activity-parameters"]}
- {id: E-IO-SIGCHANGE, k: check, t: "Signature changes break pending activities via deserialization", s: "Changing activity parameter count or types does not cause NDEs because inputs are not compared on replay. Attempts scheduled before the deploy keep the old payload and can fail to deserialize on retry, so keep activities backward compatible.", on: [tmp.act_def], mode: eval, sdk: [all], src: ["CRN:9", DOCS], v: verified, note: "Docs only cover the determinism half. The pending-activity failure comes from Slack staff answers. No source supports 'errors appear only in worker logs', so it was dropped. Revised from: Changing parameter count or types does not break determinism but pending activities fail to deserialize; errors appear only in worker logs.", url: ["https://docs.temporal.io/workflow-definition#deterministic-constraints"]}
- {id: E-IO-PAYLOAD, k: check, t: "Large inputs/outputs through workflows or activities", s: "All inputs and results are recorded in history; pass minimal data, compress, or use external storage/claim check.", on: [data.large, tmp.dc], mode: eval, sdk: [all], src: ["CRN:3", "BPG:6-7,12", DOCS], v: verified, url: ["https://docs.temporal.io/troubleshooting/blob-size-limit-error", "https://docs.temporal.io/external-storage"]}
- {id: E-IO-DATETIME, k: check, t: "Datetime/duration payloads across languages", s: "JSON has no native date/time or duration type. Python's default converter cannot handle date/time values without the Pydantic converter. Polyglot apps need a shared format (ISO 8601 or epoch) or a custom converter.", on: [tmp.dc], mode: eval, sdk: [python, go], src: ["BPG:20", DOCS], v: verified, note: 'Docs do not discuss Go time.Duration serialization. The Python default converter now handles datetime.datetime but not date or time. Revised from: JSON has no datetime/duration type; Python and Go, or polyglot apps, need a custom data converter with a shared format.', url: ["https://docs.temporal.io/develop/python/data-handling/data-conversion"]}
# Workflow options
- {id: E-WFO-RUNTIMEOUT, k: check, t: "Workflow Run/Execution Timeout set instead of an in-code timer", s: "These timeouts force-terminate with no cleanup or compensation; use a timer in workflow code. Legit: load-test cleanup.", on: [tmp.wf_options], mode: eval, sdk: [all], src: ["CRN:3-4", "BPG:9-10", DOCS], v: verified, note: "Docs say the timeout is not delivered to workflow code and recommend a Timer instead. The load-test exception is guide-only.", url: ["https://docs.temporal.io/encyclopedia/detecting-workflow-failures", "https://docs.temporal.io/evaluate/features/timeouts-and-retries"]}
- {id: E-WFO-EXECTIMEOUT, k: check, t: "Execution Timeout only to bound retries of cron workflows", s: "Workflow Execution Timeout spans retries and Continue-As-New runs. Docs generally discourage workflow timeouts; their most common use is bounding a Temporal Cron Job. Prefer an in-workflow Timer for business deadlines.", on: [tmp.wf_options, tmp.cron_wf], mode: eval, sdk: [all], src: ["CRN:4", DOCS], v: verified, note: "Docs say 'most commonly used', not 'recommended only'. Revised from: Workflow Execution Timeout includes retries and continue-as-new runs; recommended only with cron jobs.", url: ["https://docs.temporal.io/encyclopedia/detecting-workflow-failures"]}
- {id: E-WFO-TASKTIMEOUT, k: check, t: "Raised Workflow Task Timeout masks the real problem", s: "Raising Workflow Task Timeout above the 10s default is discouraged. The documented reason is very large histories. Raising it often masks blocking I/O in workflow code, slow data converters or overloaded workers; fix the cause.", on: [tmp.wf_options], mode: eval, sdk: [all], src: ["CRN:4", "BPG:9", DOCS], v: verified, note: 'Docs present large-history loading as the legitimate reason to raise it, not as something it masks. Revised from: Usually raised to hide I/O in workflow code, huge histories or slow codecs; fix the cause instead.', url: ["https://docs.temporal.io/encyclopedia/detecting-workflow-failures#workflow-task-timeout", "https://docs.temporal.io/troubleshooting/execution-failures#workflow-task-execution-latency-high"]}
- {id: E-WFO-RETRY, k: check, t: "Workflow retry policy set without a strong reason", s: "Workflows don't retry by default, and docs discourage Workflow Retry Policies: a workflow failure usually means a bug or bad input that a rerun won't fix. Retry specific steps in workflow code instead.", on: [tmp.wf_options, tmp.retry_policy], mode: eval, sdk: [all], src: ["BPG:10", "CRN:4", DOCS], v: verified, note: "Failing fast on an NDE comes from failure exception types (E-WFO-FAILTYPES), not from a Retry Policy. Docs don't name valid use cases. Revised from: Workflows should not fail on intermittent issues; valid uses are retrying a child's whole sequence or failing fast on NDE.", url: ["https://docs.temporal.io/encyclopedia/retry-policies#default-behavior", "https://docs.temporal.io/develop/python/best-practices/error-handling#configure-custom-retry-policies"]}
- {id: E-WFO-FAILTYPES, k: check, t: "Fail workflow on NDE via failure exception types", s: "Configure workflow failure exception types to fail (and optionally retry) on non-determinism instead of getting stuck; activity idempotency is key.", on: [tmp.worker, tmp.wf_def], mode: eval, sdk: [all], src: ["CRN:4-5", DOCS], v: verified, note: "TS: NDE failure only via worker-level workflowFailureErrorTypes. Python marks the option experimental. Go has no equivalent list.", url: ["https://typescript.temporal.io/api/interfaces/worker.WorkerOptions#workflowfailureerrortypes", "https://docs.temporal.io/references/failures#application-failure"]}
- {id: E-WFO-ID, k: check, t: "Workflow ID should be a meaningful business identifier", s: "Business IDs give uniqueness and idempotent starts; set reuse policy deliberately; avoid reusing one ID at high frequency; never branch on Run ID.", on: [tmp.wf_options, tmp.client], mode: eval, sdk: [all], src: ["BPG:9", "CRN:20", DOCS], v: verified, note: "The reuse limit is 1 new execution per ID per second, with burst allowance.", url: ["https://docs.temporal.io/workflow-execution/workflowid-runid#workflow-id", "https://docs.temporal.io/evaluate/cloud/limits#per-primitive-id-reuse-rate-limits"]}
# Retry policy
- {id: E-RP-SAME, k: check, t: "One retry policy / ActivityOptions shared by every activity", s: "Activities need individual timeouts, retries and non-retryable lists; a shared options object is a smell.", on: [tmp.act_options, tmp.retry_policy], mode: eval, sdk: [all], src: ["CRN:5,25", "BPG:13", DOCS], v: verified, url: ["https://docs.temporal.io/develop/python/best-practices/error-handling#configure-custom-retry-policies"]}
- {id: E-RP-NOMAXINT, k: check, t: "Retry intervals allowed to grow very large", s: "maximum_interval defaults to 100x initial_interval; a large initial interval or an explicitly large maximum stretches retries far apart and delays recovery.", on: [tmp.retry_policy], mode: eval, sdk: [all], src: ["CRN:5", DOCS], v: verified, note: "Revised: maximum_interval defaults to 100x initial_interval (100s with defaults), so intervals are already capped. Hours apart only if initial_interval itself is large.", url: ["https://docs.temporal.io/encyclopedia/retry-policies#properties"]}
- {id: E-RP-TRANSIENT-NR, k: check, t: "Transient errors marked non-retryable", s: "Network errors, 429 and 5xx listed as non-retryable fail the workflow on the first blip.", on: [tmp.retry_policy], mode: eval, sdk: [all], src: ["CRN:5,7-8", "SKL:core/gotchas.md", DOCS], v: verified, url: ["https://docs.temporal.io/design-patterns/non-retryable-errors#common-pitfalls"]}
- {id: E-RP-PERM-R, k: check, t: "Permanent errors left retryable", s: "400/401, not-found and validation failures left retryable cause infinite retry loops; mark them non-retryable.", on: [tmp.act_def, tmp.retry_policy], mode: eval, sdk: [all], src: ["CRN:8", "SKL:core/gotchas.md", DOCS], v: verified, note: "Retries are unlimited by default but bounded by Schedule-To-Close if set.", url: ["https://docs.temporal.io/design-patterns/non-retryable-errors#handle-non-retryable-errors-in-the-workflow", "https://docs.temporal.io/encyclopedia/retry-policies#properties"]}
- {id: E-RP-MAX1, k: check, t: "maximum_attempts=1 used as 'do not retry'", s: "With one attempt a worker restart marks the activity TimedOut with no retry; handle that in workflow code. Only for provably unsafe-to-retry operations.", on: [tmp.retry_policy], mode: eval, sdk: [all], src: ["CRN:5,27", "SKL:core/gotchas.md", DOCS], v: verified, url: ["https://docs.temporal.io/activity-execution#activity-execution-lifecycle", "https://docs.temporal.io/design-patterns/fixed-count-retries#disabling-retries-entirely"]}
- {id: E-RP-NRTYPE-NAME, k: check, t: "Non-retryable error types match by type-name string", s: "non_retryable_error_types matches the failure's type string exactly, not by substring. Java defaults the type to the fully qualified class name. Renamed classes, or errors wrapped in plain exceptions, silently stop matching.", on: [tmp.retry_policy], mode: eval, sdk: [all], src: ["CRN:5,7", DOCS], v: verified, note: 'Types are not always fully qualified. Python uses the unqualified class name by default (Slack). Setting ApplicationFailure type explicitly avoids this. Revised from: non_retryable_error_types matches fully-qualified type names as strings; renamed or wrapped errors silently stop matching.', url: ["https://docs.temporal.io/encyclopedia/application-failures#error-propagation", "https://docs.temporal.io/develop/java/best-practices/error-handling#read-cause-chain"]}
# Error handling
- {id: E-ERR-SWALLOW, k: check, t: "Activity errors swallowed in workflow code", s: "Ignoring an activity error lets the workflow proceed as if it succeeded; re-raise, fall back deliberately, or document why.", on: [tmp.wf_def], mode: eval, sdk: [all], src: ["CRN:7-8", "SKL:core/gotchas.md", DOCS], v: verified, url: ["https://docs.temporal.io/develop/java/best-practices/error-handling#catch-exception-not-throwable", "https://docs.temporal.io/design-patterns/non-retryable-errors#common-pitfalls"]}
- {id: E-ERR-CATCHCANCEL, k: check, t: "CanceledFailure caught and ignored", s: "Catching cancellation and continuing breaks propagation; run cleanup in a detached scope, then re-raise.", on: [tmp.cancel, tmp.wf_def], mode: eval, sdk: [all], src: ["CRN:8", DOCS], v: verified, url: ["https://docs.temporal.io/develop/java/best-practices/error-handling#handle-activity-failures", "https://docs.temporal.io/develop/typescript/workflows/cancellation-scopes#external-cancellation-example"]}
- {id: E-ERR-BROADCATCH, k: check, t: "Broad catch or recover around the whole workflow body", s: "Broad catches (Throwable/Error, catch-all-and-return, Go recover) swallow SDK control errors, cancellation and real bugs that must propagate. Catch only the narrow types you can recover from and rethrow the rest.", on: [tmp.wf_def], mode: eval, sdk: [all], src: ["CRN:8", DOCS], v: verified, note: 'NDEs are not delivered to workflow code, so a broad catch cannot hide them. Docs cite SDK control errors such as DestroyWorkflowThreadError and UnsupportedVersion instead. Revised from: Hides NDEs, deadlocks and SDK errors that must propagate; catch specific types only.', url: ["https://docs.temporal.io/develop/java/best-practices/error-handling#catch-exception-not-throwable", "https://docs.temporal.io/develop/go/best-practices/error-handling#error-handling"]}
- {id: E-ERR-STRINGIFY, k: check, t: "Temporal failures flattened to log strings", s: "Converting failures to strings loses cause, type and retryState needed for diagnosis.", on: [tmp.wf_def], mode: eval, sdk: [all], src: ["CRN:8", DOCS], v: verified, url: ["https://docs.temporal.io/develop/java/best-practices/error-handling#read-cause-chain", "https://docs.temporal.io/encyclopedia/application-failures#error-propagation"]}
- {id: E-ERR-NONTEMPORAL, k: check, t: "Non-Temporal exceptions in workflow code retry the task forever", s: "Any non-TemporalFailure exception fails the workflow task, which retries until code is fixed (Go: error fails the workflow, panic fails the task).", on: [tmp.wf_def], mode: eval, sdk: [all], src: ["BPG:10", "CRN:7", DOCS], v: verified, url: ["https://docs.temporal.io/references/failures#application-failure"]}
- {id: E-ERR-EXTERNAL, k: check, t: "Signaling or cancelling external workflows can fail", s: "Signal and cancel requests to missing or closed external workflows fail, and the error surfaces in the calling workflow. Unhandled, it can fail the workflow, so check the result and handle not-found explicitly.", on: [tmp.signal, tmp.client], mode: eval, sdk: [all], src: ["CRN:7", "BPG:14-15", DOCS], v: verified, note: "Docs don't say an external cancel to a missing workflow fails the workflow task. They say the request fails or throws. Revised from: Signals to missing/closed workflows error; external cancel requests to missing workflows fail the workflow task. Check results.", url: ["https://typescript.temporal.io/api/interfaces/workflow.ExternalWorkflowHandle", "https://docs.temporal.io/references/events#external-workflow-events"]}
# Determinism
- {id: E-DET-NONDET, k: check, t: "Time, random, UUID, I/O or network in workflow code", s: "Workflow code reruns on replay; non-deterministic calls cause NDEs. Use SDK time/random/UUID APIs or move work to activities.", on: [tmp.wf_def, hazard.time, hazard.random, hazard.io], mode: eval, sdk: [all], src: ["CRN:8", "SKL:core/determinism.md", DOCS], v: verified, url: ["https://docs.temporal.io/workflow-definition#deterministic-constraints", "https://docs.temporal.io/develop/python/workflows/basics#workflow-logic-requirements"]}
- {id: E-DET-ENV, k: check, t: "Env vars, mutable globals or config services read in workflow", s: "Values that can change between execution and replay cause NDEs; pass as workflow input or read via side effect/local activity.", on: [tmp.wf_def, hazard.env], mode: eval, sdk: [all], src: ["CRN:13", DOCS], v: verified, url: ["https://docs.temporal.io/develop/java/workflows/basics#workflow-logic-requirements"]}
- {id: E-DET-ITER, k: check, t: "Iterating unordered maps or sets in workflow code", s: "Java HashMap/HashSet, Go maps and Python sets iterate non-deterministically; sort first.", on: [tmp.wf_def, hazard.iter_order], mode: eval, sdk: [java, go, python], src: ["CRN:13-14", "SKL:core/determinism.md", DOCS], v: verified, url: ["https://docs.temporal.io/develop/go/workflows/basics#workflow-logic-requirements", "https://learn.temporal.io/tutorials/java/background-check/durable-execution/#intrinsic-non-deterministic-logic"]}
- {id: E-DET-IDS, k: check, t: "Child workflow IDs or random values not deterministic", s: "Child IDs, UUIDs and jitter must be replay-safe. Use SDK APIs (workflow.uuid4, Workflow.randomUUID, Workflow.NewGuid, SideEffect in Go), never uuid4 or randomUUID. In TypeScript the sandbox already makes Math.random deterministic.", on: [tmp.child, hazard.random], mode: eval, sdk: [all], src: ["CRN:9", DOCS], v: verified, note: "TS sandbox replaces Math.random with a seeded version, so 'never Math.random' is wrong for TypeScript. Go has no seeded random API; docs say use SideEffect. Revised from: Child IDs, UUIDs and jitter must come from SDK deterministic random APIs, never Math.random/uuid4/randomUUID.", url: ["https://docs.temporal.io/develop/java/workflows/basics#workflow-logic-requirements", "https://docs.temporal.io/develop/go/workflows/basics#workflow-logic-requirements"]}
- {id: E-DET-TIMER0, k: check, t: "Timer duration changed to or from 0 (or -1 in .NET)", s: "Changing a timer's duration to or from 0 (Java, Python, Go) or -1 (.NET) is non-deterministic. Other duration changes are safe. The TypeScript SDK is unaffected by the 0 case.", on: [tmp.timer], mode: eval, sdk: [java, python, go, dotnet, typescript], src: ["CRN:9", DOCS], v: verified, note: "'TypeScript timers are identified by source position' is not in the docs. Removed. Revised from: Changing a timer to/from 0 (Java/Python/Go) or -1 (.NET) is non-deterministic; TypeScript timers are identified by source position.", url: ["https://docs.temporal.io/workflow-definition#non-deterministic-change"]}
- {id: E-DET-SIDEEFFECTS, k: check, t: "Logging, metrics or notifications in workflow code duplicate on replay", s: "Use the workflow logger and replay-aware APIs; put other side effects in activities.", on: [tmp.wf_def], mode: eval, sdk: [all], src: ["SKL:core/gotchas.md", DOCS], v: verified, url: ["https://docs.temporal.io/develop/python/workflows/basics#workflow-logic-requirements", "https://docs.temporal.io/develop/go/workflows/basics#workflow-logic-requirements"]}
- {id: E-DET-THREAD, k: check, t: "Native threads or concurrency primitives in workflow code", s: "Threads and non-SDK concurrency produce non-deterministic ordering; use SDK concurrency primitives.", on: [tmp.wf_def, hazard.thread], mode: eval, sdk: [all], src: ["SKL:core/determinism.md", DOCS], v: verified, url: ["https://docs.temporal.io/develop/java/workflows/basics#workflow-logic-requirements", "https://docs.temporal.io/develop/go/workflows/basics#workflow-logic-requirements"]}
- {id: E-DET-RUNID, k: check, t: "Workflow logic depends on Run ID", s: "Run ID changes on retry and continue-as-new; depending on it causes NDEs and broken external keys.", on: [tmp.wf_def], mode: eval, sdk: [all], src: ["BPG:9", "CRN:20", DOCS], v: verified, url: ["https://docs.temporal.io/workflow-execution/workflowid-runid#run-id"]}
- {id: E-DET-SANDBOX, k: check, t: "Determinism protection differs by SDK", s: "Python and TypeScript sandbox workflow code. Java, Go and .NET rely on developer discipline; .NET detects some task-scheduler misuse at runtime. Go offers the workflowcheck static analyzer. Even the sandboxes can be bypassed or miss library state.", on: [tmp.wf_def], mode: eval, sdk: [all], src: ["SKL:core/determinism.md", "CRN:8", DOCS], v: verified, note: 'No docs source found for a Java static checker. Violations also surface as task failures on first execution, not only at replay. Revised from: Python and TypeScript sandbox workflows; Java, Go and .NET do not, so violations surface only at replay. Static checkers exist for Java and Go.', url: ["https://docs.temporal.io/develop/python/best-practices/python-sdk-sandbox", "https://pkg.go.dev/go.temporal.io/sdk/contrib/tools/workflowcheck#readme-temporal-workflow-check"]}
# Versioning
- {id: E-VER-NONE, k: check, t: "Long-running workflows with no versioning strategy", s: "Without a strategy, deploys cause NDEs in running workflows.", on: [tmp.wf_def, wait.long], mode: eval, sdk: [all], src: ["CRN:9", DOCS], v: verified, note: "Docs say incompatible changes may cause NDEs in running workflows, not that every deploy will.", url: ["https://docs.temporal.io/develop/safe-deployments", "https://docs.temporal.io/workflow-definition#non-deterministic-change"]}
- {id: E-VER-PATCHDEBT, k: check, t: "Accumulated patches with no removal plan", s: "Patches must go through patch-in, deprecate and remove; never let them accumulate.", on: [tmp.patch], mode: eval, sdk: [all], src: ["CRN:10", "BPG:22", "SKL:core/versioning.md", DOCS], v: verified, url: ["https://docs.temporal.io/develop/typescript/workflows/versioning#patching", "https://docs.temporal.io/develop/python/workflows/versioning#deprecated-patches"]}
- {id: E-VER-AUTOUP, k: check, t: "AUTO_UPGRADE used without patching at NDE-causing changes", s: "Auto-upgrade moves workflows to new code at the next task; it still needs patching wherever the command sequence changes.", on: [tmp.worker_versioning], mode: eval, sdk: [all], src: ["CRN:9-10", "SKL:core/versioning.md", DOCS], v: verified, url: ["https://docs.temporal.io/worker-versioning#versioning-behaviors", "https://docs.temporal.io/production-deployment/worker-deployments/worker-versioning#choosing-behavior"]}
- {id: E-VER-UNNEEDED, k: check, t: "Patching changes that do not alter commands", s: "No versioning needed for activity implementations, activity/child arguments and options, timer durations (except to/from 0, or -1 in .NET), or a new Signal handler for a Signal type not yet sent.", on: [tmp.patch], mode: eval, sdk: [all], src: ["CRN:10", "SKL:core/versioning.md", DOCS], v: verified, note: 'Docs limit the handler case to Signal types not yet sent to the execution. Slack adds that cancellation-type changes are unsafe. Revised from: No versioning needed for activity implementations, call arguments, retry/timeouts, new handlers, or timer durations on non-NDE boundaries.', url: ["https://docs.temporal.io/workflow-definition#non-deterministic-change", "https://docs.temporal.io/workflow-definition#deterministic-constraints"]}
- {id: E-VER-CHOICE, k: check, t: "Versioning approach should match workflow duration", s: "Worker Versioning is GA and the default recommendation. Short Workflows: PINNED. Spanning deploys without Continue-As-New: AUTO_UPGRADE plus patching. Long with Continue-As-New: PINNED plus upgrade on Continue-As-New (Public Preview).", on: [tmp.worker_versioning, tmp.patch], mode: eval, sdk: [all], src: ["SKL:core/versioning.md", "CRN:10", DOCS], v: verified, ts: true, note: "Conflict resolved: BPG:22 is stale. 'Rewrites: new workflow type' is not in docs. Revised from: Short workflows: Worker Versioning PINNED. Long with CAN: PINNED plus upgrade on CAN. Long without CAN: AUTO_UPGRADE plus patching. Rewrites: new workflow type.", url: ["https://docs.temporal.io/production-deployment/worker-deployments/worker-versioning#choosing-behavior", "https://temporal.io/blog/ga-worker-versioning-public-preview-upgrade-on-continue-as-new"]}
# Testing
- {id: E-TEST-REPLAY, k: check, t: "No replay tests gating deploys", s: "Run replay tests in CI against representative recent open and closed histories and fail the build on any error. Cover multiple execution paths, including both branches of active patches, to catch NDEs before deploy.", on: [tmp.replay_test, tmp.wf_def], mode: eval, sdk: [all], src: ["CRN:11-12", "BPG:22", "SKL:core/gotchas.md", DOCS], v: verified, note: "'Only pre-production defence' is overstated. Docs present Worker Versioning (pinning) as the other safeguard. Revised from: Replay tests are the only pre-production defence against NDEs: in CI, gating, fresh representative histories, multiple execution shapes, both branches of active patches.", url: ["https://docs.temporal.io/develop/safe-deployments#use-replay-testing-before-and-during-your-deployments", "https://docs.temporal.io/develop/python/best-practices/testing-suite#replay"]}
- {id: E-TEST-FAILURE, k: check, t: "Only happy-path tests; mocks always succeed", s: "Test worker restart, exhausted retries, each timeout type, cancellation, child termination, signals during CAN; mocks should throw too.", on: [tmp.test_env], mode: eval, sdk: [all], src: ["CRN:12-13", "SKL:core/gotchas.md", DOCS], v: verified, note: "Docs cover worker kill/restart and injecting activity errors via mocks. The full scenario list (signals during CAN, child termination) is practitioner guidance.", url: ["https://docs.temporal.io/best-practices/pre-production-testing", "https://docs.temporal.io/develop/go/best-practices/testing-suite#mock-activities"]}
# Fan-out and loops
- {id: E-FAN-4MB, k: check, t: "Too many commands scheduled in one workflow task", s: "Large fan-outs can exceed the 4 MB gRPC limit; batch, or yield every N commands.", on: [fanout.parallel, tmp.wf_def], mode: eval, sdk: [all], src: ["CRN:14", "BPG:9", DOCS], v: verified, note: "Docs add that this terminates the Workflow Execution rather than retrying it.", url: ["https://docs.temporal.io/troubleshooting/blob-size-limit-error#grpc-message-size-limit", "https://docs.temporal.io/design-patterns/parallel-execution#common-pitfalls"]}
- {id: E-FAN-PARTIAL, k: check, t: "Fan-out does not await every branch before closing", s: "allOf/Promise.all/gather fail fast and Go futures need explicit Get; wait for all activities/children before closing or continuing-as-new.", on: [fanout.parallel], mode: eval, sdk: [all], src: ["CRN:14-15", DOCS], v: verified, note: "Docs confirm fail-fast and the Go per-Future Get. Awaiting every branch before closing or CAN is implied, not stated.", url: ["https://docs.temporal.io/design-patterns/parallel-execution#common-pitfalls", "https://docs.temporal.io/design-patterns/parallel-execution#basic-parallel-activities"]}
- {id: E-FAN-CHILDSTART, k: check, t: "Async child not awaited until started", s: "Await the child's start (not completion) so the start command flushes before the parent closes.", on: [tmp.child], mode: eval, sdk: [all], src: ["CRN:15", DOCS], v: verified, url: ["https://docs.temporal.io/develop/go/workflows/child-workflows#async-child-workflows", "https://docs.temporal.io/design-patterns/child-workflows#fire-and-forget"]}
- {id: E-FAN-LIMITS, k: check, t: "Per-workflow concurrency limits on open activities/children/signals", s: "A workflow caps concurrently open activities, children and external signals; spread across children if needed.", on: [fanout.parallel], mode: eval, sdk: [all], src: ["CRN:14,21", DOCS], v: verified, note: "Limit is 2,000 incomplete per type; docs recommend 500 or fewer.", url: ["https://docs.temporal.io/evaluate/cloud/limits#programming-model-level"]}
# Timers
- {id: E-TMR-CHUNK, k: check, t: "Long timers chunked into many short ones", s: "Long timers are durable server-side; chunking adds history for nothing.", on: [tmp.timer], mode: eval, sdk: [all], src: ["CRN:15", DOCS], v: verified, note: "Docs confirm timers are durable, last months or years, and are cheap. 'Chunking adds history for nothing' is an inference.", url: ["https://docs.temporal.io/develop/go/workflows/timers", "https://docs.temporal.io/develop/java/workflows/timers#timers"]}
- {id: E-TMR-JITTER, k: check, t: "Many timers firing at the same instant", s: "Add jitter so mass timer fires do not hit the history service, workers and namespace RPS/APS limits at once.", on: [tmp.timer], mode: eval, sdk: [all], src: ["CRN:15", DOCS], v: verified, note: "Docs name 'Timer Storms' and recommend jitter. History-service pressure detail comes from Slack/forum.", url: ["https://docs.temporal.io/best-practices/managing-aps-limits#common-reasons-customers-hit-aps-limits"]}
- {id: E-TMR-EARLY, k: check, t: "Fire a timer early by cancelling its scope", s: "A started timer's duration can't change. To wake early or reschedule, wait on a condition with a timeout that a signal/update handler sets, or race the timer and cancel it (Go: cancel the timer context).", on: [tmp.timer, tmp.cancel], mode: eval, sdk: [all], src: ["CRN:15", DOCS], v: verified, note: "Docs' primary pattern is await or condition with a timeout. Cancelling a scope is one option, not the only one. Revised from: Timer durations cannot change once started; cancel a wrapping scope from a signal/update handler to fire early.", url: ["https://docs.temporal.io/design-patterns/updatable-timer#solution", "https://docs.temporal.io/develop/typescript/workflows/cancellation-scopes#internal-cancellation-example"]}
# Polling
- {id: E-POLL-WF, k: check, t: "Polling in workflow code with sleep plus activity", s: "A sleep-plus-activity polling loop in workflow code adds timer, activity and workflow-task events each iteration. Polling every 30 s for a week is ~20K iterations, far past the 51,200-event limit. Use activity retries or a heartbeating activity loop.", on: [tmp.timer, wait.poll], mode: eval, sdk: [all], src: ["CRN:16", DOCS], v: verified, note: "20K is the iteration count; events are roughly 10x that. Docs rate a workflow timer loop 'Avoid this approach'. Revised from: Each iteration adds timer and activity events; polling every 30 s for a week is about 20K events. Move the loop into an activity.", url: ["https://docs.temporal.io/design-patterns/polling#comparison-with-alternatives", "https://docs.temporal.io/design-patterns/polling"]}
- {id: E-POLL-NOHB, k: check, t: "Long start-to-close with no heartbeat", s: "Without heartbeats a hung activity is not detected or cancellable until start-to-close expires.", on: [tmp.act_options, tmp.heartbeat], mode: eval, sdk: [all], src: ["CRN:16", DOCS], v: verified, url: ["https://docs.temporal.io/design-patterns/long-running-activity#common-pitfalls", "https://docs.temporal.io/encyclopedia/detecting-activity-failures#activity-heartbeat"]}
# Local activities and side effects
- {id: E-LA-DEFAULT, k: check, t: "Local Activities used by default", s: "Use regular activities unless very high throughput fan-outs of very short activities need the latency; LAs lose rate limiting and routing.", on: [tmp.local_act], mode: eval, sdk: [all], src: ["BPG:5,13", "CRN:16", "SKL:core/patterns.md", DOCS], v: verified, url: ["https://docs.temporal.io/local-activity#choosing-between-regular-activities-and-local-activities", "https://docs.temporal.io/design-patterns/local-activities#when-to-use"]}
- {id: E-LA-LONG, k: check, t: "Local Activity runs longer than a few seconds", s: "LAs should finish within seconds including retries; cap maximumAttempts. They share the workflow worker's CPU.", on: [tmp.local_act], mode: eval, sdk: [all], src: ["BPG:13", "CRN:16", DOCS], v: verified, note: "Docs: complete in a few seconds including retries; long retries add timer events; runs on the Workflow Task thread.", url: ["https://docs.temporal.io/local-activity", "https://docs.temporal.io/design-patterns/local-activities#benefits-and-trade-offs"]}
- {id: E-LA-CONSECUTIVE, k: check, t: "Consecutive Local Activities without a durable checkpoint", s: "LA results persist only when the workflow task completes; a crash re-runs every LA in that task. Idempotency is non-negotiable.", on: [tmp.local_act], mode: eval, sdk: [all], src: ["CRN:17", "SKL:core/patterns.md", DOCS], v: verified, url: ["https://temporal.io/blog/reduce-latency-and-speed-up-your-temporal-workflows#use-local-activities", "https://docs.temporal.io/best-practices/cost-optimization#local-activities"]}
- {id: E-SE-FAIL, k: check, t: "SideEffect used for something that can fail", s: "If a side effect could fail use an activity; Core-based SDKs have no SideEffect, use local activities.", on: [tmp.side_effect], mode: eval, sdk: [all], src: ["BPG:20", DOCS], v: verified, note: "Docs say SideEffect exists only in Go, Java, PHP; other SDKs use Local Activities.", url: ["https://docs.temporal.io/workflow-execution/event#side-effect"]}
# Queries
- {id: E-Q-MUTATE, k: check, t: "Query handler or update validator mutates state or blocks", s: "Queries and validators must be read-only and non-blocking: no awaits, sleeps or commands.", on: [tmp.query, tmp.update], mode: eval, sdk: [all], src: ["CRN:17,19", "BPG:16", "SKL:core/gotchas.md", DOCS], v: verified, url: ["https://docs.temporal.io/handling-messages#update-validators", "https://docs.temporal.io/evaluate/features/workflow-message-passing"]}
- {id: E-Q-HEAVY, k: check, t: "Heavy computation inside a query handler", s: "Precompute into workflow state; the query should only return it.", on: [tmp.query], mode: eval, sdk: [all], src: ["CRN:17"], v: guide-only, note: "Docs say queries must not mutate or block, but say nothing about precomputing results or the cost of computation inside handlers."}
- {id: E-Q-FAKE-RR, k: check, t: "Signal then poll a query to fake request/response", s: "For a write that needs a result, use an Update instead of a Signal followed by Query polling. Signal plus Query polling is acceptable only when the request must be asynchronous.", on: [tmp.signal, tmp.query], mode: eval, sdk: [all], src: ["CRN:17,19", "SKL:core/patterns.md", DOCS], v: verified, note: 'Revised from: Use an Update instead.', url: ["https://docs.temporal.io/evaluate/features/workflow-message-passing"]}
- {id: E-Q-RATE, k: check, t: "High-rate queries against one workflow", s: "Queries against executions that are not in a worker's cache, and all queries against closed executions, force a history replay. High query rates add worker load; watch replay latency and sticky cache hits.", on: [tmp.query], mode: eval, sdk: [all], src: ["CRN:17", DOCS], v: verified, note: 'Docs do not mention per-execution query buffering. The replay-on-query detail comes from a GitHub issue and Slack. Revised from: Queries buffer per execution and cache misses force full replay; watch replay latency and worker cache.', url: ["https://docs.temporal.io/troubleshooting/performance-bottlenecks#caching", "https://docs.temporal.io/troubleshooting/performance-bottlenecks#high-workflow_task_replay_latency"]}
# Signals
- {id: E-SIG-HANDLER-WORK, k: check, t: "Activities or children started directly in signal handlers", s: "Async handlers that start Activities or Child Workflows interleave with each other and with the main method. To get ordered or serialized processing, buffer requests in workflow state and process them from the main loop, or guard handlers with a workflow lock.", on: [tmp.signal], mode: eval, sdk: [all], src: ["CRN:18,20", "BPG:15", DOCS], v: verified, note: 'Docs allow handlers that start Activities. Queuing work for the main loop is one advanced option, not a requirement. Revised from: Buffer the request in workflow state and process it from the main loop; keeps concurrency explicit and draining trivial.', url: ["https://docs.temporal.io/handling-messages#message-handler-patterns", "https://temporal.io/blog/robust-message-handlers#the-battle-between-handlers-and-queues"]}
- {id: E-SIG-DRAIN, k: check, t: "Workflow closes or continues-as-new with handlers still running", s: "Wait for all handlers to finish (all_handlers_finished) before completing or continuing-as-new. Otherwise handlers are cut off, the worker logs an unfinished-handler warning, and clients waiting on Updates get errors.", on: [tmp.signal, tmp.update, tmp.can], mode: eval, sdk: [all], src: ["CRN:18,22", "BPG:22", DOCS], v: verified, note: 'Docs describe a logged warning, not a failed Workflow Task. Revised from: Wait for all handlers to finish first, or the task fails with TMPRL1102.', url: ["https://docs.temporal.io/handling-messages#message-handler-patterns", "https://docs.temporal.io/develop/python/workflows/message-passing#wait-for-message-handlers"]}
- {id: E-SIG-IDEMP, k: check, t: "Signal handlers not idempotent or deterministic", s: "Signals can (rarely) be delivered twice and handler code is workflow code.", on: [tmp.signal], mode: eval, sdk: [all], src: ["BPG:15", DOCS], v: verified, url: ["https://docs.temporal.io/handling-messages#message-handler-patterns"]}
- {id: E-SIG-NEED-RESULT, k: check, t: "Signal used where the caller needs a result or validation", s: "Signals are fire-and-forget; use an Update.", on: [tmp.signal], mode: eval, sdk: [all], src: ["CRN:18", DOCS], v: verified, url: ["https://docs.temporal.io/evaluate/features/workflow-message-passing"]}
- {id: E-SIG-INTERLEAVE, k: check, t: "Handlers interleave and may run before the main method", s: "Handler invocations interleave with each other and the main method, and run first under SignalWithStart; synchronise explicitly.", on: [tmp.signal, tmp.update], mode: eval, sdk: [all], src: ["CRN:18-19", DOCS], v: verified, url: ["https://docs.temporal.io/handling-messages"]}
- {id: E-SIG-CAN-QUIET, k: check, t: "Signals too frequent for Continue-As-New to happen", s: "A constant stream of Signals can keep Continue-As-New from succeeding, because new Signals must be handled first. The run can then reach the 10,000-Signal or history limits. Batch Signals and drain them before Continue-As-New.", on: [tmp.signal, tmp.can], mode: eval, sdk: [all], src: ["BPG:15", DOCS], v: verified, note: 'Revised from: CAN needs a quiet moment with no unhandled signals; constant signals block CAN until history limits terminate the run.', url: ["https://docs.temporal.io/evaluate/cloud/limits#programming-model-level", "https://temporal.io/blog/very-long-running-workflows#continue-as-new"]}
# Updates
- {id: E-UPD-CONCURRENT, k: check, t: "Concurrent updates assumed to be serialized", s: "The SDK does not serialize concurrent updates; gate handlers if order matters.", on: [tmp.update], mode: eval, sdk: [all], src: ["CRN:19", DOCS], v: verified, url: ["https://docs.temporal.io/handling-messages", "https://docs.temporal.io/develop/python/workflows/message-passing#control-handler-concurrency"]}
- {id: E-UPD-EXCEPTION, k: check, t: "Update handler throws non-Temporal exceptions", s: "Only TemporalFailure reaches the client from a handler; other exceptions fail the workflow task and leave the update in flight. Validators reject before history.", on: [tmp.update], mode: eval, sdk: [all], src: ["CRN:19", "BPG:16", DOCS], v: verified, note: "Docs: ApplicationFailure, or an Activity or Child failure after retries are exhausted, fails the Update. Other exceptions fail the Workflow Task and leave the Update pending.", url: ["https://docs.temporal.io/handling-messages#exceptions"]}
- {id: E-UPD-CLOSE, k: check, t: "Workflow closes while updates are running", s: "If the workflow completes or continues-as-new while an Update handler is running, the caller gets a NOT_FOUND or 'workflow execution already completed' error. Wait for all handlers to finish before closing.", on: [tmp.update], mode: eval, sdk: [all], src: ["CRN:19", DOCS], v: verified, note: 'Revised from: An update may never return if the workflow closes mid-update; hold the workflow open until handlers finish.', url: ["https://docs.temporal.io/develop/python/workflows/message-passing#update-problems", "https://docs.temporal.io/handling-messages#message-handler-patterns"]}
# Entity workflows
- {id: E-ENT-NOCAN, k: check, t: "Signal-heavy entity workflow with no Continue-As-New", s: "Long-lived signal-driven workflows need Continue-As-New. History is capped at 51,200 events or 50 MB, and each run accepts at most 10,000 Signals. Trigger it with the continue-as-new-suggested flag.", on: [tmp.signal, wait.long], mode: eval, sdk: [all], src: ["CRN:20", DOCS], v: verified, note: 'Revised from: Runs for weeks without CAN will hit history limits.', url: ["https://docs.temporal.io/evaluate/cloud/limits#programming-model-level", "https://docs.temporal.io/guides/durable-gaming-sessions#signal-volume-limits"]}
- {id: E-ENT-QUEUE-CAN, k: check, t: "Buffered work not carried across Continue-As-New", s: "Pass the buffered queue and entity state as input to the next run or in-flight work is silently dropped.", on: [tmp.can], mode: eval, sdk: [all], src: ["CRN:20", DOCS], v: verified, url: ["https://docs.temporal.io/design-patterns/continue-as-new#common-pitfalls", "https://docs.temporal.io/guides/entity-pattern-loyalty-points#phase-6-handle-continue-as-new-for-indefinite-execution"]}
# Child workflows
- {id: E-CHILD-ORG, k: check, t: "Child Workflow used only to organise code", s: "Children add events, roughly double Actions, add latency and UI noise; use functions or activities.", on: [tmp.child], mode: eval, sdk: [all], src: ["CRN:21", "BPG:10", "SKL:core/patterns.md", DOCS], v: verified, url: ["https://docs.temporal.io/child-workflows#when-to-use-child-workflows", "https://docs.temporal.io/best-practices/cost-optimization#actions-optimization"]}
- {id: E-CHILD-VALID, k: check, t: "Valid reasons for a Child Workflow", s: "History isolation, separate task queue/worker pool, parallelism beyond per-workflow limits, independent cancel/timeout/retry, or outliving the parent.", on: [tmp.child], mode: eval, sdk: [all], src: ["CRN:21", "BPG:10", DOCS], v: verified, note: "Docs also list representing a single resource by Workflow ID and periodic logic via Continue-As-New.", url: ["https://docs.temporal.io/design-patterns/child-workflows#when-to-use", "https://docs.temporal.io/child-workflows#when-to-use-child-workflows"]}
- {id: E-CHILD-PCP, k: check, t: "Parent Close Policy not chosen deliberately", s: "Default TERMINATE kills children when the parent closes, including on CAN; ABANDON lets them outlive it; REQUEST_CANCEL sends a cancel.", on: [tmp.child, tmp.can], mode: eval, sdk: [all], src: ["CRN:22", "BPG:11", "SKL:core/patterns.md", DOCS], v: verified, url: ["https://docs.temporal.io/parent-close-policy", "https://docs.temporal.io/design-patterns/continue-as-new#common-pitfalls"]}
- {id: E-CHILD-SIBLING, k: check, t: "Peer operations modelled as children", s: "If there is no real parent-child relationship start sibling workflows from the client or an activity.", on: [tmp.child], mode: eval, sdk: [all], src: ["CRN:21"], v: guide-only, note: "Docs do not say this. Forum answers suggest starting workflows from an activity instead of using children."}
- {id: E-CHILD-STATE, k: check, t: "Parent and child sharing state", s: "Parent and child cannot share local state; communicate with Signals.", on: [tmp.child], mode: eval, sdk: [all], src: ["BPG:11", DOCS], v: verified, url: ["https://docs.temporal.io/child-workflows#when-to-use-child-workflows"]}
# Continue-As-New
- {id: E-CAN-SUGGESTED, k: check, t: "Hard-coded event counts instead of continue-as-new-suggested", s: "Use the SDK suggestion flag rather than hard-coded counts; Cloud users do not see server history warnings.", on: [tmp.can], mode: eval, sdk: [all], src: ["DOCS", "CRN:20", "BPG:7"], url: ["https://docs.temporal.io/best-practices/worker#manage-event-history-growth"], v: verified}
- {id: E-CAN-DRAIN, k: check, t: "Activities or children still running at Continue-As-New", s: "Running activities lose retries and results; children follow parent close policy. Drain first.", on: [tmp.can], mode: eval, sdk: [all], src: ["CRN:14,22", "BPG:22", DOCS], v: verified, url: ["https://temporal.io/blog/very-long-running-workflows#continue-as-new", "https://docs.temporal.io/design-patterns/continue-as-new#common-pitfalls"]}
- {id: E-CAN-TIMERS, k: check, t: "Timers assumed to carry across Continue-As-New", s: "Timers do not carry; compute the remaining duration and pass it to the next run.", on: [tmp.can, tmp.timer], mode: eval, sdk: [all], src: ["CRN:14,22", "BPG:22", DOCS], v: verified, note: "Indirect support: the blog says a new run starts from a clean state and computes remaining sleep from its input. No docs page says it explicitly.", url: ["https://temporal.io/blog/very-long-running-workflows#continue-as-new"]}
- {id: E-CAN-CRON, k: check, t: "Cron workflow calls Continue-As-New", s: "The cron schedule is lost when a cron workflow continues-as-new.", on: [tmp.cron_wf, tmp.can], mode: eval, sdk: [all], src: ["BPG:20"], v: guide-only, note: "Docs are silent. Only an official forum answer and an open GitHub issue (temporal#746) confirm that the cron schedule is lost after Continue-As-New."}
# Cancellation
- {id: E-CXL-HEARTBEAT, k: check, t: "Cancellable activity that never heartbeats", s: "Activities learn of cancellation only via heartbeat; without it they run to completion.", on: [tmp.act_def, tmp.cancel], mode: eval, sdk: [all], src: ["CRN:23", "BPG:14", "SKL:core/patterns.md", DOCS], v: verified, url: ["https://docs.temporal.io/encyclopedia/workflow/cancellation-and-termination#cancellation", "https://docs.temporal.io/develop/typescript/workflows/cancellation#cancel-an-activity"]}
- {id: E-CXL-DETACHED, k: check, t: "Cleanup after cancellation not in a detached scope", s: "Cleanup inherits the cancelled context and fails immediately unless run in a detached/disconnected scope.", on: [tmp.cancel, tmp.saga], mode: eval, sdk: [all], src: ["CRN:24", DOCS], v: verified, url: ["https://docs.temporal.io/encyclopedia/workflow/cancellation-and-termination#cancellation", "https://docs.temporal.io/develop/java/best-practices/error-handling#handle-activity-failures"]}
- {id: E-CXL-WAIT, k: check, t: "Cancellation type not set when the parent must wait", s: "Activities default to TRY_CANCEL: the call fails immediately while the Activity may keep running. Set WAIT_CANCELLATION_COMPLETED when the workflow must not proceed until then. Child Workflow defaults vary by SDK; check them.", on: [tmp.cancel, tmp.child], mode: eval, sdk: [all], src: ["CRN:23", DOCS], v: verified, note: 'The TypeScript docs say Child Workflows default to waiting for cancellation to complete. That contradicts the blanket claim for children. Revised from: Parents do not wait for children or activities to confirm cancellation unless WAIT_CANCELLATION_COMPLETED is set.', url: ["https://docs.temporal.io/develop/typescript/workflows/cancellation#cancel-an-activity"]}
# Saga
- {id: E-SAGA-STATE, k: check, t: "Compensations tracked in a local variable", s: "Track completed steps in workflow state so handlers can drive compensation.", on: [tmp.saga], mode: eval, sdk: [all], src: ["CRN:24"], v: guide-only, note: "The docs' saga examples keep compensations in a local list. Nothing says to track them in workflow state for handlers."}
- {id: E-SAGA-ORDER, k: check, t: "Compensations run in parallel or wrong order", s: "Run compensations in reverse (LIFO) order unless cross-dependencies were considered.", on: [tmp.saga], mode: eval, sdk: [all], src: ["CRN:25", "SKL:core/patterns.md", DOCS], v: verified, url: ["https://docs.temporal.io/design-patterns/saga-pattern", "https://docs.temporal.io/design-patterns/saga-pattern#implementation"]}
- {id: E-SAGA-POLICY, k: check, t: "Compensation activities reuse the forward retry policy", s: "Compensations must be idempotent. Give them a StartToCloseTimeout but no ScheduleToCloseTimeout, and let them retry until they succeed rather than reusing a capped forward retry policy.", on: [tmp.saga, tmp.retry_policy], mode: eval, sdk: [all], src: ["CRN:25", DOCS], v: verified, note: 'Revised from: Compensations must be idempotent and usually need more attempts, longer intervals and a narrower non-retryable list.', url: ["https://docs.temporal.io/design-patterns/saga-pattern#best-practices"]}
- {id: E-SAGA-FAILS, k: check, t: "No decision for failing compensations", s: "Decide how failed compensations are handled. Let them retry, log failures and continue with the remaining compensations, alert for manual intervention on persistent failures, and rethrow the original error. Never fail silently.", on: [tmp.saga], mode: eval, sdk: [all], src: ["CRN:25", DOCS], v: verified, note: 'Revised from: Choose alert-only (non-retryable after N, fail workflow) or retry forever with alerting; never swallow.', url: ["https://docs.temporal.io/design-patterns/saga-pattern#best-practices"]}
- {id: E-SAGA-NEED, k: check, t: "Saga added without a real rollback requirement", s: "Read-only or naturally re-runnable work, or fail-and-alert cases, do not need saga complexity.", on: [tmp.saga, reliab.compensation], mode: both, sdk: [all], src: ["CRN:24"], v: guide-only, note: "Docs describe the saga pattern but do not say when a saga is unnecessary."}
- {id: E-SAGA-JAVA, k: check, t: "Java has a built-in Saga helper", s: "Prefer io.temporal.workflow.Saga over a hand-rolled stack in Java.", on: [tmp.saga], mode: eval, sdk: [java], src: ["CRN:24", DOCS], v: verified, url: ["https://docs.temporal.io/design-patterns/saga-pattern#implementation"]}
# Activity options
- {id: E-AO-STC, k: check, t: "Start-To-Close timeout missing or not per activity", s: "Start-To-Close or Schedule-To-Close must be set. Always set Start-To-Close, tuned per Activity and longer than the maximum possible run time; add heartbeats for long Activities.", on: [tmp.act_options], mode: eval, sdk: [all], src: ["BPG:12-13", "CRN:25", DOCS], v: verified, note: 'Revised from: Start-To-Close or Schedule-To-Close must be set; Start-To-Close strongly recommended, set to the longest normal run, tuned per activity.', url: ["https://docs.temporal.io/encyclopedia/detecting-activity-failures#start-to-close-timeout", "https://docs.temporal.io/evaluate/features/timeouts-and-retries#activity-timeouts"]}
- {id: E-AO-STS, k: check, t: "Schedule-To-Start timeout set without host-specific need", s: "Rarely needed; legit for host-specific queues that should fail fast. Monitor schedule-to-start latency instead.", on: [tmp.act_options], mode: eval, sdk: [all], src: ["BPG:12", "CRN:26", DOCS], v: verified, url: ["https://docs.temporal.io/encyclopedia/detecting-activity-failures#schedule-to-start-timeout", "https://docs.temporal.io/design-patterns/worker-specific-taskqueue#common-pitfalls"]}
- {id: E-AO-SCTC, k: check, t: "Schedule-To-Close used appropriately", s: "Schedule-To-Close bounds the total Activity lifetime including retries. Use it when a business SLA or retry budget requires the Activity to succeed or fail within a fixed window.", on: [tmp.act_options], mode: eval, sdk: [all], src: ["CRN:26", DOCS], v: verified, note: 'Docs do not mention update handlers or single-worker setups as use cases. Revised from: Bounds total lifetime including retries; useful for update handlers that must return quickly, single-worker setups, or a total retry budget.', url: ["https://docs.temporal.io/design-patterns/fixed-wall-time-retries", "https://docs.temporal.io/encyclopedia/detecting-activity-failures#schedule-to-start-timeout"]}
- {id: E-AO-HEARTBEAT, k: check, t: "Long-running activity without heartbeat timeout and heartbeats", s: "Set a short heartbeat timeout, heartbeat frequently with progress details, and read them back on retry.", on: [tmp.act_options, tmp.heartbeat], mode: eval, sdk: [all], src: ["CRN:26-27", "BPG:11", DOCS], v: verified, url: ["https://docs.temporal.io/design-patterns/long-running-activity#common-pitfalls", "https://docs.temporal.io/develop/go/activities/timeouts#activity-heartbeats"]}
- {id: E-AO-CLIENTSIDE, k: check, t: "Downstream client timeouts longer than the activity timeout", s: "Server-side activity timeouts must exceed worker-side call timeouts or retries overlap and duplicate actions.", on: [tmp.act_options, effect.http], mode: eval, sdk: [all], src: ["BPG:13"], v: guide-only, note: "Not stated in docs. The AI cookbook examples do set client timeouts below Start-To-Close (15s vs 30s), which agrees with the check."}
- {id: E-AO-SHUTDOWN, k: check, t: "Worker graceful shutdown shorter than Start-To-Close", s: "Set the Worker graceful-shutdown period longer than the longest expected Activity runtime so in-flight Activities finish during deploys. Otherwise they are cancelled and retried after a timeout.", on: [tmp.worker], mode: eval, sdk: [all], src: ["CRN:25", DOCS], v: verified, note: 'Docs compare the shutdown period with the longest Activity runtime, not with Start-To-Close. Revised from: Make the graceful-shutdown period exceed start-to-close so in-flight activities finish during rolling deploys.', url: ["https://docs.temporal.io/encyclopedia/workers/worker-shutdown#worker-shutdown-behavior", "https://docs.temporal.io/serverless-workers/aws-lambda#lifecycle"]}
- {id: E-AO-TQ, k: check, t: "Activities on separate task queues without a reason", s: "Valid: separate worker pool (GPU, RAM), priority lane, host affinity, rate limiting. Otherwise added complexity.", on: [tmp.act_options], mode: eval, sdk: [all], src: ["CRN:27", "BPG:7,13,17", DOCS], v: verified, url: ["https://temporal.io/blog/how-many-activities-should-i-use-in-my-temporal-workflow#necessitywhen-using-fewer-activities-wont-work", "https://docs.temporal.io/design-patterns/downstream-rate-limiting#best-practices"]}
# Activity code
- {id: E-AC-IDEMP, k: check, t: "Activity not idempotent", s: "Activities are at-least-once; use idempotency keys, dedupe tables or if-exists-skip.", on: [tmp.act_def, effect.payment, effect.db_write, effect.notify], mode: eval, sdk: [all], src: ["CRN:27", "BPG:11", "SKL:core/gotchas.md", DOCS], v: verified, url: ["https://docs.temporal.io/best-practices/error-handling#idempotence", "https://docs.temporal.io/activity-definition#idempotency"]}
- {id: E-AC-ERRCLASS, k: check, t: "Retryable vs non-retryable errors not distinguished", s: "Raise a non-retryable ApplicationFailure for permanent errors such as validation, authorization and most 4xx responses. Keep 408, 409, 429 and 5xx retryable, and honor Retry-After.", on: [tmp.act_def], mode: eval, sdk: [all], src: ["CRN:27", "SKL:core/gotchas.md", DOCS], v: verified, note: 'Revised from: Throw non-retryable ApplicationFailure for validation, auth and 4xx; let transient errors propagate.', url: ["https://docs.temporal.io/best-practices/error-handling#non-retryable-errors", "https://docs.temporal.io/ai/cookbook/http-retry-enhancement-python"]}
- {id: E-AC-LOGGER, k: check, t: "Bare logging instead of the SDK activity logger", s: "The SDK logger adds workflow ID, run ID, activity type and attempt for correlation.", on: [tmp.act_def], mode: eval, sdk: [all], src: ["CRN:27-28", DOCS], v: verified, url: ["https://docs.temporal.io/develop/typescript/platform/observability#logging", "https://docs.temporal.io/guides/durable-gaming-sessions#phase-2-define-the-activities"]}
- {id: E-AC-CLEANUP, k: check, t: "Resources not released on every path including cancellation", s: "Use defer/try-with-resources/finally; cancellation is just another error path.", on: [tmp.act_def], mode: eval, sdk: [all], src: ["CRN:28", DOCS], v: verified, url: ["https://docs.temporal.io/develop/typescript/workflows/cancellation#cancel-an-activity", "https://docs.temporal.io/encyclopedia/workers/worker-shutdown#worker-shutdown-behavior"]}
- {id: E-AC-DI, k: check, t: "Clients constructed per activity invocation", s: "Inject DB connections and HTTP clients from the worker.", on: [tmp.act_def, tmp.worker], mode: eval, sdk: [all], src: ["CRN:28", DOCS], v: verified, url: ["https://docs.temporal.io/design-patterns/activity-dependency-injection"]}
- {id: E-AC-MULTISTEP, k: check, t: "One activity performs several all-or-nothing steps", s: "An activity is the unit of failure detection, retry and visibility; multi-write activities hide progress and complicate retries.", on: [tmp.act_def, effect.db_write], mode: eval, sdk: [all], src: ["BPG:4,11-12", "DOCS"], url: ["https://temporal.io/blog/how-many-activities-should-i-use-in-my-temporal-workflow"], v: verified}
- {id: E-AC-LLM-RETRY, k: check, t: "LLM client retries left enabled inside activities", s: "Set LLM client max_retries to 0 so Temporal owns retries; classify 429/timeouts/5xx retryable and 401/invalid input non-retryable.", on: [tmp.act_def, effect.llm], mode: eval, sdk: [all], src: ["SKL:core/ai-patterns.md", DOCS], v: verified, url: ["https://docs.temporal.io/ai/cookbook/hello-world-openai-responses-python", "https://docs.temporal.io/ai/cookbook/agentic-loop-tool-call-claude-python#create-the-activity-for-claude-invocations"]}
# Workers and task queues
- {id: E-WK-HA, k: check, t: "Fewer than two workers per task queue", s: "Run at least two workers for high availability.", on: [tmp.worker], mode: eval, sdk: [all], src: ["BPG:17", DOCS], v: verified, url: ["https://docs.temporal.io/design-patterns/downstream-rate-limiting#best-practices"]}
- {id: E-WK-REG, k: check, t: "Workers on one task queue register different types", s: "All workers polling a task queue must register identical workflows and activities.", on: [tmp.worker], mode: eval, sdk: [all], src: ["BPG:17", DOCS], v: verified, note: "A worker that registers no activities (or no workflows) does not poll for that task type, so it is exempt.", url: ["https://docs.temporal.io/develop/go/workers/run-worker-process"]}
- {id: E-WK-RATELIMIT, k: check, t: "Rate limiting configured inconsistently", s: "Worker slots and per-worker limits are local; task-queue activities-per-second must be set identically on every worker.", on: [tmp.worker, rate.limit], mode: eval, sdk: [all], src: ["BPG:17", DOCS], v: verified, url: ["https://docs.temporal.io/design-patterns/downstream-rate-limiting#best-practices", "https://docs.temporal.io/design-patterns/downstream-rate-limiting#common-pitfalls"]}
- {id: E-WK-ORDER, k: check, t: "Strict FIFO ordering assumed across executions", s: "Task Queues are not strictly FIFO across executions: tasks spread over multiple partitions, and retries reorder work. Use Priority or Fairness to steer dispatch, and enforce strict ordering in workflow code.", on: [tmp.worker, tmp.priority], mode: eval, sdk: [all], src: ["BPG:8,18", DOCS], v: verified, note: "Docs say a backlog dispatches before sync match, which contradicts the 'sync match beats backlog' wording. Revised from: Task queues do not guarantee order across executions (sync match beats backlog); use priority/fairness. Order within one workflow is code-controlled.", url: ["https://docs.temporal.io/task-queue#task-ordering", "https://docs.temporal.io/develop/task-queue-priority-fairness#how-to-use-priority"]}
- {id: E-WK-FAIRNESS, k: check, t: "Multi-tenant workload without fairness keys", s: "Large tenants starve small ones in a shared backlog; use fairness keys and weights.", on: [tenant.multi, tmp.priority], mode: eval, sdk: [all], src: ["SKL:SKILL.md", "SKL:core/priority-fairness.md", DOCS], v: verified, ts: true, url: ["https://docs.temporal.io/develop/task-queue-priority-fairness#how-to-use-fairness", "https://docs.temporal.io/standalone-activity#key-features", "https://docs.temporal.io/design-patterns/fairness", "https://docs.temporal.io/develop/task-queue-priority-fairness#task-queue-fairness"], note: "Fairness must be enabled per Namespace and is a paid feature on Temporal Cloud."}
# Schedules and cron
- {id: E-SCH-CRON, k: check, t: "Cron workflows instead of Schedules", s: "Cron jobs are superseded by Schedules.", on: [tmp.cron_wf], mode: eval, sdk: [all], src: ["BPG:19-20", "CRN:4", DOCS], v: verified, url: ["https://docs.temporal.io/cron-job", "https://docs.temporal.io/evaluate/features/schedules#how-to-choose-between-a-schedule-a-cron-job-and-start-delay"]}
- {id: E-SCH-JITTER, k: check, t: "Many schedules firing simultaneously without jitter", s: "Set jitter to spread executions and stay within namespace action rates.", on: [tmp.schedule], mode: eval, sdk: [all], src: ["BPG:19", DOCS], v: verified, url: ["https://docs.temporal.io/evaluate/cloud/limits#schedules-rate-limit", "https://docs.temporal.io/best-practices/managing-aps-limits#common-reasons-customers-hit-aps-limits"]}
- {id: E-SCH-DELAYED, k: check, t: "Schedule with run limit 1 used for delayed start", s: "Use Start Delay for exactly one run at a time known when you start it; Schedules are built for recurring runs and are more machinery than a single delay needs.", on: [tmp.schedule], mode: eval, sdk: [all], src: ["BPG:19", DOCS], v: verified, ts: true, note: "Docs no longer mark Start Delay experimental. They call sleep-first a worse fit, because Workflow code runs and Signals are handled before the delay ends. Revised from: Use Start Delay or a workflow that sleeps first; cheaper and easier to scale.", url: ["https://docs.temporal.io/evaluate/features/schedules#how-to-choose-between-a-schedule-a-cron-job-and-start-delay", "https://docs.temporal.io/design-patterns/delayed-start"]}
- {id: E-SCH-OVERLAP, k: check, t: "Overlap policy and last-completion semantics not considered", s: "Default overlap policy is Skip; with overlaps allowed, last completion result is the latest completed run at start time.", on: [tmp.schedule], mode: eval, sdk: [all], src: ["BPG:19", DOCS], v: verified, url: ["https://docs.temporal.io/schedule#policies", "https://docs.temporal.io/schedule#last-completion-result"]}
# Data converter
- {id: E-DC-COMPRESS, k: check, t: "Large payloads not compressed", s: "Consider a Payload Codec to compress large payloads. When chaining codecs, compress before encrypting.", on: [tmp.dc, data.large], mode: eval, sdk: [all], src: ["BPG:12,20", "CRN:3", DOCS], v: verified, note: 'Docs present compression as an option, not a default recommendation. Compress-before-encrypt is standard practice; the docs do not state it. Revised from: Compression via data converter/codec is recommended by default; compress before encrypting.', url: ["https://docs.temporal.io/payload-codec", "https://docs.temporal.io/develop/python/data-handling/data-encryption"]}
- {id: E-DC-KEYS, k: check, t: "Encryption codec without key rotation", s: "Encryption codecs need a key-rotation story.", on: [tmp.dc], mode: eval, sdk: [all], src: ["BPG:20", DOCS], v: verified, url: ["https://docs.temporal.io/key-management"]}
- {id: E-DC-LATENCY, k: check, t: "Slow codec inside workflow task processing", s: "Codec latency counts against workflow task execution and can cause timeouts.", on: [tmp.dc], mode: eval, sdk: [all], src: ["BPG:21", "CRN:4", DOCS], v: verified, url: ["https://docs.temporal.io/troubleshooting/performance-bottlenecks#high-workflow_task_replay_latency"]}
# Visibility
- {id: E-VIS-BUSINESS, k: check, t: "Visibility API or search attributes used in business logic", s: "Visibility is eventually consistent and rate limited; use Queries or an external store for business logic.", on: [tmp.search_attr], mode: eval, sdk: [all], src: ["BPG:21", DOCS], v: verified, url: ["https://docs.temporal.io/search-attribute", "https://docs.temporal.io/visibility#how-current-is-visibility-data"]}
- {id: E-VIS-PII, k: check, t: "Sensitive data in search attributes", s: "Search attributes are not encoded by data converters or codecs; never store PII.", on: [tmp.search_attr], mode: eval, sdk: [all], src: ["BPG:20-21", DOCS], v: verified, url: ["https://docs.temporal.io/search-attribute", "https://docs.temporal.io/evaluate/features/data-encryption"]}
- {id: E-VIS-SIZE, k: check, t: "Too much data in search attributes or memos", s: "Use Search Attributes only for fields you filter or sort on in UI, CLI or List APIs, within custom Search Attribute limits. Keep other execution data in workflow state, Queries or an external store.", on: [tmp.search_attr], mode: eval, sdk: [all], src: ["BPG:21", DOCS], v: verified, note: 'Docs do not mention that memos are eventually consistent. Revised from: Store only execution-related data you will query in UI/CLI; memos are eventually consistent.', url: ["https://docs.temporal.io/search-attribute", "https://docs.temporal.io/search-attribute#custom-search-attribute"]}
# Misc
- {id: E-INT-HIDDEN, k: check, t: "Interceptors that change behaviour invisibly", s: "Interceptors are powerful but confuse when forgotten; document them.", on: [tmp.interceptor], mode: eval, sdk: [all], src: ["BPG:22-23"], v: guide-only, note: "Docs describe interceptors and warn that workflow interceptors run during replay. They do not warn about hidden behavior or say to document interceptors."}
- {id: E-SESS-GO, k: check, t: "Go sessions rerun all session activities on worker death", s: "Sessions are Go-only. If the session worker dies, the session fails, its scheduled Activities are cancelled, and the workflow must recreate the session and redo the sequence. Worker-specific Task Queues work in every SDK.", on: [tmp.session], mode: eval, sdk: [go], src: ["BPG:23", DOCS], v: verified, note: 'Rerunning the activities is not automatic; the workflow must handle ErrSessionFailed. Revised from: Sessions are Go-only; prefer worker-specific task queues available in every SDK.', url: ["https://docs.temporal.io/develop/go/workers/sessions#create-a-session", "https://docs.temporal.io/guides/worker-execution-affinity#background-and-best-practices"]}
- {id: E-SA-SINGLE, k: check, t: "Workflow that wraps a single activity", s: "A workflow around one activity may be a Standalone Activity: fewer actions, lower latency.", on: [tmp.wf_def, tmp.standalone_act], mode: eval, sdk: [python, typescript, go, java, dotnet, ruby, rust], src: ["SKL:core/standalone-activities.md", "DOCS"], url: ["https://docs.temporal.io/standalone-activity", "https://docs.temporal.io/standalone-activity#standalone-activity-versus-workflow-activity", "https://docs.temporal.io/best-practices/cost-optimization#standalone-activities-vs-a-workflow-that-runs-a-single-activity"], v: verified, ts: true, note: "Docs have quickstarts for Ruby and Rust too, which the pack's sdk list leaves out. The release stage was not stated in the retrieved chunks."}
- {id: E-ACTIONS, k: check, t: "Patterns that generate excessive Actions", s: "Children for code organisation, polling in workflow code, chunked timers and needless signals inflate billable Actions.", on: [tmp.child, tmp.timer, tmp.signal], mode: eval, sdk: [all], src: ["CRN:2,21", DOCS], v: verified, url: ["https://docs.temporal.io/evaluate/cloud/actions", "https://docs.temporal.io/best-practices/cost-optimization#actions-optimization"]}

# SDK-specific entries distilled from the temporal-developer skill's per-language
# references, verified against the Temporal Docs MCP on 2026-10-16.
sdk_specific:
  - id: S-PY-RECOGNIZE
    k: sdk
    t: Recognizing Python workflow, activity, worker and client code
    s: Workflows are classes decorated @workflow.defn with an async @workflow.run method; activities are functions or methods decorated @activity.defn; workers build temporalio.worker.Worker; clients call temporalio.client.Client.connect.
    detect: from temporalio import workflow/activity; @workflow.defn, @workflow.run, @workflow.signal/query/update/init, @activity.defn; Worker(; Client.connect(; temporalio.testing
    mode: both
    sdk:
    - python
    src:
    - SKL:python/python.md
    - DOCS
    v: verified
    url:
    - https://github.com/temporalio/sdk-python/blob/main/README.md
    - https://docs.temporal.io/develop/python/workers/run-worker-process
  - id: S-PY-NONDET-STDLIB
    k: sdk
