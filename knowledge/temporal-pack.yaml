# ---------------------------------------------------------------------------
# Detection markers (deterministic; no LLM). `temporal_sdk` regexes run on a
# file's import lines (`import_lines`): a match puts that file in evaluation mode. `manifests` and
# `adjacent` drive the repository-level Tier 0 scan.
# ---------------------------------------------------------------------------
detection:
  languages:
    ".py": python
    ".pyi": python
    ".ts": typescript
    ".tsx": typescript
    ".js": typescript
    ".mjs": typescript
    ".cjs": typescript
    ".go": go
    ".java": java
    ".kt": java
    ".scala": java
    ".cs": dotnet
    ".rb": ruby
    ".rs": rust
    ".php": php
  # Markers only count on these import/declaration lines, so a mention inside a
  # string, comment or doc does not make a file Temporal code.
  import_lines:
    python: '^\s*(from|import)\s'
    typescript: '^\s*(import\b|export\b.*\bfrom\b)|\brequire\('
    go: '^\s*(import\s+)?([\w.]+\s+)?"'
    java: '^\s*import\s'
    dotnet: '^\s*(global\s+)?using\s'
    ruby: '^\s*(require|require_relative)\b|^\s*class\s+\S+\s*<\s*Temporalio::|^\s*(include|extend)\s+Temporalio::'
    rust: '^\s*(pub\s+)?use\s|^\s*extern\s+crate\s'
    php: '^\s*use\s'
  temporal_sdk:
    python: ['\btemporalio\b']
    typescript: ['@temporalio/']
    go: ['go\.temporal\.io/sdk']
    java: ['\bio\.temporal\.']
    dotnet: ['\bTemporalio\.']
    ruby: ['\bTemporalio::', 'require\s+[''"]temporalio']
    rust: ['\btemporalio_sdk\b', '\btemporalio_client\b']
    php: ['\bTemporal\\(Workflow|Activity|Client|Worker)\b']
  manifests:
    - requirements.txt
    - pyproject.toml
    - setup.py
    - Pipfile
    - package.json
    - go.mod
    - pom.xml
    - build.gradle
    - build.gradle.kts
    - "*.csproj"
    - Gemfile
    - Cargo.toml
    - composer.json
  temporal_manifest: ['\btemporalio\b', '@temporalio/', 'go\.temporal\.io/sdk', 'io\.temporal', '\bTemporalio\b', 'temporal/sdk']
  adjacent:
    airflow: ['apache-airflow', '\bfrom airflow\b', '\bimport airflow\b']
    celery: ['\bcelery\b']
    rq: ['\bfrom rq\b', '\bpython-rq\b', '^rq[=<>~ ]']
    dramatiq: ['\bdramatiq\b']
    dagster: ['\bdagster\b']
    prefect: ['\bprefect\b']
    luigi: ['\bluigi\b']
    sidekiq: ['\bsidekiq\b']
    resque: ['\bresque\b']
    bullmq: ['\bbullmq\b', '\bbull\b']
    agenda: ['"agenda"']
    hangfire: ['\bHangfire\b']
    quartz: ['\borg\.quartz', '\bquartz-scheduler\b', '\bQuartz\.']
    step_functions: ['\bstepfunctions\b', '\bStepFunctions\b', '\bsfn\b', 'states:StartExecution']
    cadence: ['go\.uber\.org/cadence', 'com\.uber\.cadence']
    camunda: ['\bcamunda\b', '\bzeebe\b']
    conductor: ['\bnetflix\.conductor\b', '\bconductor-client\b', '\bconductor-python\b']
    argo: ['argoproj\.io', '\bargo-workflows\b']
    kafka: ['\bkafka\b']
    rabbitmq: ['\bamqp\b', '\bpika\b', '\brabbitmq\b']
    sqs: ['\bsqs\b', '\bSQS\b']

# ---------------------------------------------------------------------------
# Gates: conditions that reduce or rule out suitability. Drive the
# 'not suitable' explanation.
# ---------------------------------------------------------------------------
gates:
- id: G-LATENCY
  k: gate
  t: "Extreme low latency where milliseconds matter"
  s: "Default Temporal adds round-trip latency (about 850 ms for a three-Activity Workflow on Cloud). Hard millisecond paths are a poor fit; for user-facing paths, latency patterns (Local Activities, Eager Start, Early Return) can cut first response to about 160 ms."
  on: [latency.hard, trigger.http]
  mode: conv
  sdk: [all]
  src: ["BPG:5", "RUN:1-2", DOCS]
  v: verified
  note: 'Docs never mention high-frequency trading. Latency figures are approximate benchmarks and time-sensitive. Eager Start covers Go, Java, Python, TypeScript and .NET only. Revised from: Paths like high-frequency trading where milliseconds matter are a poor fit. Short-lived workflows in a user-facing path need top-down evaluation of caller constraints, not automatic rejection.'
  url: ["https://docs.temporal.io/design-patterns/performance-latency-patterns", "https://docs.temporal.io/design-patterns/approval#when-to-use"]
- id: G-READONLY
  k: gate
  t: "Cheap, redo-safe synchronous reads gain little from Temporal"
  s: "A short synchronous read that is cheap and safe to redo, where the caller can simply retry, gains little from durable execution; long multi-call reads where losing progress is costly can still benefit."
  on: [read.only_sync]
  mode: conv
  sdk: [all]
  src: ["BPG:5", DOCS]
  v: verified
  note: "'Adds nothing' is overstated. Docs say CRUD-only entities belong in a database, and redoing cheap steps doesn't need durability. Revised from: If the work only queries records out of a database synchronously, Temporal adds nothing."
  url: ["https://docs.temporal.io/ai/featured/memory-state-stripe#when-you-need-durable-execution", "https://docs.temporal.io/design-patterns/entity-workflow#when-to-use"]
- id: G-DATAPLANE
  k: gate
  t: "Large data belongs outside Event History"
  s: "Payloads are stored in Event History and limited (2 MB per payload on Cloud). Offload large data to an object store and pass references (claim check); Activities fetch and store the data. External Storage offers this built in (Public Preview)."
  on: [data.stream, data.large]
  mode: both
  sdk: [all]
  src: ["BPG:5", "SKL:core/patterns.md", DOCS]
  v: verified
  note: "The docs don't use the phrase 'control plane, not data plane', and they don't address fit for high-volume streaming. External Storage preview status is time-sensitive. Revised from: Big data must not pass through Temporal. Payloads are recorded in history and limited; pass references and let activities move data."
  url: ["https://docs.temporal.io/troubleshooting/blob-size-limit-error", "https://docs.temporal.io/best-practices/worker#manage-event-history-growth"]
- id: G-NO-ORCHESTRATION
  k: gate
  t: "No side effects or multi-step work to make durable"
  s: "Libraries, UI components, pure computation, type definitions and infrastructure-as-code have nothing to orchestrate; Temporal would add cost without benefit."
  on: []
  mode: conv
  sdk: [all]
  src: ["DER"]
  v: guide-only
  note: "Derived heuristic. Docs only note that pure functions with no dependencies don't need DI patterns. Nothing classifies libraries, UI or IaC repos."
- id: G-SDK-LANG
  k: gate
  t: "Core logic must be in a language with a Temporal SDK"
  s: "Temporal has eight official SDKs: .NET, Go, Java, PHP, Python, Ruby, Rust and TypeScript, and Workflows in different languages can call each other. Third-party SDKs (Swift, Haskell, Clojure, Scala) are not officially supported."
  on: []
  mode: conv
  sdk: [all]
  src: ["SKL:SKILL.md", DOCS]
  v: verified
  ts: true

# ---------------------------------------------------------------------------
# Value: what Temporal does for the user. Every 'WHY' in a design must cite
# one of these and the evidence that triggers it.
# ---------------------------------------------------------------------------
  note: "The pack left out PHP. Docs list Rust v1.1.0 with no stage; 'Public Preview' appears only in a May 2026 sdk-rust repo commit. Revised from: Official SDKs: Go, Java, Python, TypeScript, .NET, PHP, Ruby and Rust, and Workflows in different languages can call each other. Core logic in other languages needs a polyglot boundary (Activities or services in a supported language)."
  url: ["https://docs.temporal.io/evaluate/understanding-temporal#temporal-sdks", "https://docs.temporal.io/develop", "https://docs.temporal.io/encyclopedia/architecture/temporal-sdks"]
values:
- id: V-DURABLE
  k: value
  t: "Durable execution: work resumes after crashes without checkpoint code"
  s: "Workflow state is rebuilt from Event History by replay, so a crashed process resumes where it left off; hand-built checkpoint/resume code goes away."
  on: [reliab.checkpoint, state.cross_step, wait.long]
  mode: conv
  sdk: [all]
  src: ["SKL:SKILL.md", "SKL:core/determinism.md", DOCS]
  v: verified
  url: ["https://docs.temporal.io/evaluate/why-temporal#why-temporal", "https://docs.temporal.io/encyclopedia/event-history/event-history-python#How-History-Replay-Provides-Durable-Execution"]
- id: V-RETRY
  k: value
  t: "Declarative retries and timeouts per activity"
  s: "Each activity gets a retry policy and timeouts from configuration, not hand-written loops; failed activities retry with backoff and are rescheduled if a worker dies."
  on: [reliab.retry, reliab.timeout, flaky.api, effect.http]
  mode: conv
  sdk: [all]
  src: ["DOCS"]
  url: ["https://docs.temporal.io/evaluate/understanding-temporal#activities"]
  v: verified
- id: V-TIMERS
  k: value
  t: "Durable timers: waits of seconds to months survive restarts"
  s: "Timers are stored server-side and fire durably; long timers (hours, days, months) are fine and replace sleeps, delayed jobs and wake-up polling."
  on: [wait.sleep, wait.long, wait.poll]
  mode: conv
  sdk: [all]
  src: ["CRN:15", "SKL:core/patterns.md", DOCS]
  v: verified
  note: "Docs: timers last from one second to years. Don't rely on sub-second accuracy."
  url: ["https://docs.temporal.io/workflow-execution/timers-delays", "https://docs.temporal.io/evaluate/why-temporal#why-temporal"]
- id: V-STATE
  k: value
  t: "Workflow state replaces status tables and correlation rows"
  s: "Workflow progress lives in Workflow variables preserved by Event History and Replay, replacing state tables, status fields and checkpoint columns; Signals and Updates to the running Workflow replace callback endpoints plus table rows used for correlation."
  on: [state.diy_status, state.temp_correlation]
  mode: conv
  sdk: [all]
  src: ["RUN:2", "BPG:5", DOCS]
  v: verified
  note: "The docs don't support 'schema migrations vanish' or 'database stops being the consensus'. Revised from: Progress lives as plain object state in the workflow: temporary tables and surrogate correlation IDs disappear, schema migrations for progress tracking vanish, and the database stops being the consensus for progress."
  url: ["https://docs.temporal.io/evaluate/why-temporal#why-temporal", "https://temporal.io/blog/temporal-replaces-state-machines-for-distributed-applications#orchestration-as-code-eliminating-the-need-for-explicit-state-machines"]
- id: V-QUERY-UX
  k: value
  t: "One Query by one ID gives current progress"
  s: "UIs and callers read workflow progress with a single Query by workflow ID instead of reconstructing it from many database queries."
  on: [state.diy_status, wait.human]
  mode: conv
  sdk: [all]
  src: ["RUN:2", "SKL:core/patterns.md", DOCS]
  v: verified
  note: "Queries work on running and completed Workflows but need a Worker polling the Task Queue to answer."
  url: ["https://docs.temporal.io/evaluate/features/workflow-message-passing", "https://docs.temporal.io/cli/command-reference/workflow#query"]
- id: V-VISIBILITY
  k: value
  t: "Full execution history and visibility for every run"
  s: "Each Workflow Execution keeps a durable Event History of its steps, inputs and outputs, viewable in the Web UI and CLI, including which Activity failed and with what error. Individual Activity retry attempts are not recorded as events."
  on: [reliab.dlq, effect.payment]
  mode: conv
  sdk: [all]
  src: ["SKL:core/ai-patterns.md", DOCS]
  v: verified
  note: "The original wording said every retry is recorded in history, which conflicts with the docs: retries don't add events. Revised from: Every step, input, output and retry is recorded in Event History and visible in the UI, giving an audit trail and debugging without custom logging."
  url: ["https://docs.temporal.io/evaluate/understanding-temporal#tools-to-inspect-and-steer-executions", "https://docs.temporal.io/design-patterns/polling#infrequent-polling-resource-efficient"]
- id: V-INTERACTION
  k: value
  t: "Signals and Updates bring humans and external events into running work"
  s: "Approvals, callbacks and external events are delivered to the running workflow by Signal (fire-and-forget) or Update (synchronous with validation and result), combined with timers for deadlines."
  on: [wait.human, wait.external]
  mode: conv
  sdk: [all]
  src: ["SKL:core/patterns.md", "CRN:19", DOCS]
  v: verified
  url: ["https://docs.temporal.io/evaluate/use-cases-design-patterns#common-application-patterns", "https://docs.temporal.io/evaluate/features/workflow-message-passing"]
- id: V-SAGA
  k: value
  t: "Compensation written as ordinary code"
  s: "Multi-service operations needing rollback register a compensation in Workflow code before each step and run them in reverse order on failure; durable execution ensures rollback completes after Worker crashes, and compensation Activities retry and must be idempotent."
  on: [reliab.compensation, effect.payment]
  mode: conv
  sdk: [all]
  src: ["CRN:24-25", "SKL:core/patterns.md", DOCS]
  v: verified
  note: 'Docs recommend registering compensations before each step executes, not tracking only completed steps. Revised from: Multi-service operations that need rollback track completed steps in workflow state and run compensations in reverse order, with durable retries for the compensations themselves.'
  url: ["https://docs.temporal.io/design-patterns/saga-pattern#best-practices", "https://temporal.io/blog/error-handling-in-distributed-systems#data-inconsistency"]
- id: V-SCHEDULES
  k: value
  t: "Schedules replace cron with pause, backfill and overlap control"
  s: "Recurring work runs from Temporal Schedules with overlap policies, pause and backfill, replacing cron hosts and scheduler libraries."
  on: [trigger.cron]
  mode: conv
  sdk: [all]
  src: ["BPG:18-20", DOCS]
  v: verified
  url: ["https://docs.temporal.io/evaluate/features/schedules", "https://temporal.io/blog/how-to-convert-your-job-scheduling-system-to-temporal-schedules"]
- id: V-ORCHESTRATION
  k: value
  t: "Orchestration replaces message-bus choreography"
  s: "Steps coordinated by passing messages between components become one workflow that owns ordering, state and failure handling."
  on: [choreo.msg_bus]
  mode: conv
  sdk: [all]
  src: ["BPG:5", DOCS]
  v: verified
  note: "Supported by blog posts only. No docs.temporal.io page states it directly."
  url: ["https://temporal.io/blog/building-resilient-event-driven-architecture-for-finserv-with-temporal", "https://temporal.io/blog/gremlin-podcast#orchestration-vs-choreography"]
- id: V-CODE-NOT-GRAPH
  k: value
  t: "Dynamic flows expressed in code, not a static DAG"
  s: "Workflows are ordinary code, so data-dependent and dynamic flows (for example tool calls chosen by an LLM) are natural, unlike fixed graphs."
  on: [orch.adjacent, orch.agent_loop]
  mode: conv
  sdk: [all]
  src: ["DOCS"]
  url: ["https://temporal.io/blog/the-fallacy-of-the-graph-why-your-next-workflow-should-be-code-not-a-diagram", "https://temporal.io/blog/the-fallacy-of-the-graph-why-your-next-workflow-should-be-code-not-a-diagram#1-control-flow-the-illusion-of-simplicity"]
  v: verified
- id: V-SCALE
  k: value
  t: "Scale out by partitioning work across workflows"
  s: "Temporal scales out well; partition work across many workflows rather than doing too much in one."
  on: [fanout.batch, fanout.parallel]
  mode: conv
  sdk: [all]
  src: ["BPG:9", DOCS]
  v: verified
  url: ["https://docs.temporal.io/child-workflows#when-to-use-child-workflows", "https://temporal.io/blog/workflow-engine-principles#scalability-needs-1030"]
- id: V-SAFE-DEPLOY
  k: value
  t: "In-flight work survives code deploys via versioning"
  s: "Worker Versioning and patching let running workflows finish on compatible code while new ones use new code."
  on: [wait.long]
  mode: conv
  sdk: [all]
  src: ["SKL:core/versioning.md", "CRN:9-10", DOCS]
  v: verified
  note: "Time-sensitive: Worker Versioning is GA and the docs' default. Patching is the fallback. Upgrade on Continue-As-New is Public Preview. Pre-2025 experimental versioning was removed March 2026."
  url: ["https://docs.temporal.io/best-practices/worker#use-worker-versioning-to-safely-deploy-new-workflow-code", "https://docs.temporal.io/workflow-definition#workflow-versioning"]
- id: V-FLOW-CONTROL
  k: value
  t: "Task queues give rate limiting, routing, priority and fairness"
  s: "Rate-limited or specialised dependencies are protected with task-queue rate limits and dedicated workers; priority and fairness keep tenants and tiers from starving each other."
  on: [rate.limit, tenant.multi]
  mode: conv
  sdk: [all]
  src: ["RUN:2", "BPG:17-18", "SKL:core/priority-fairness.md", DOCS]
  v: verified
  note: "Fairness is approximate and gives no compute isolation. Docs recommend separate Task Queues and Worker pools for hard isolation."
  url: ["https://docs.temporal.io/design-patterns/fairness", "https://docs.temporal.io/develop/task-queue-priority-fairness#set-rate-limits-at-the-task-queue-level"]
- id: V-AI-DURABLE
  k: value
  t: "Durable LLM and agent pipelines"
  s: "LLM calls as activities get retries for timeouts and 429s, agents survive crashes mid-run, and every model and tool call is visible in history."
  on: [effect.llm, orch.agent_loop]
  mode: conv
  sdk: [all]
  src: ["SKL:core/ai-patterns.md", DOCS]
  v: verified
  url: ["https://temporal.io/blog/building-durable-agents-with-temporal-and-ai-sdk-by-vercel#tools-in-workflow-context", "https://docs.temporal.io/ai/cookbook/agentic-loop-tool-call-claude-python#create-the-activity-for-claude-invocations"]
- id: V-JOB-QUEUE
  k: value
  t: "Standalone Activities: durable job queue without a workflow"
  s: "A single unit of work started by a client gets durable retries, a cancellable ID and submit-time deduplication; the target for teams moving off Celery, Sidekiq or homegrown brokers."
  on: [orch.adjacent, trigger.queue]
  mode: conv
  sdk: [python, typescript, go, java, dotnet, ruby, rust]
  src: ["DOCS", "SKL:core/standalone-activities.md"]
  url: ["https://docs.temporal.io/evaluate/understanding-temporal#activities", "https://docs.temporal.io/standalone-activity", "https://docs.temporal.io/evaluate/use-cases-design-patterns#common-application-patterns", "https://docs.temporal.io/evaluate/features/job-queue#resources"]
  v: verified
  ts: true
  note: "Out of scope, flagged as stale: docs say Standalone Activities are Generally Available, not Public Preview. The SDK list should add Ruby and Rust."

# ---------------------------------------------------------------------------
# Design patterns and decision rules.
# ---------------------------------------------------------------------------
patterns:
- id: P-WF-VS-ACT
  k: pattern
  t: "Workflows orchestrate; anything that can fail or vary is an Activity"
  s: "Code that could behave differently between invocations (I/O, network, DB, LLM, time, random) goes in an Activity; deterministic logic such as arithmetic may stay in the workflow."
  on: [effect.http, effect.db_write, hazard.io]
  mode: both
  sdk: [all]
  src: ["DOCS", "SKL:core/determinism.md"]
  url: ["https://docs.temporal.io/evaluate/understanding-temporal#activities"]
  v: verified
- id: P-ACT-DEFAULT
  k: pattern
  t: "When in doubt, use an Activity (not a Child Workflow)"
  s: "An Activity models a single operation on the external world; a workflow models composite operations. When in doubt, use an Activity."
  on: [tmp.child]
  mode: both
  sdk: [all]
  src: ["DOCS", "BPG:6,10"]
  url: ["https://docs.temporal.io/child-workflows#child-workflow-versus-an-activity"]
  v: verified
- id: P-STANDALONE-VS-WF
  k: pattern
  t: "One independent task: Standalone Activity; coordinating tasks: Workflow"
  s: "Migrate a job that stands on its own to a Standalone Activity; chains, groups and callbacks (for example Celery Canvas) need a Workflow."
  on: [orch.adjacent, trigger.queue, fanout.parallel]
  mode: conv
  sdk: [python, typescript, go, java, dotnet, ruby, rust]
  src: ["DOCS", "SKL:core/standalone-activities.md"]
  url: ["https://docs.temporal.io/guides/celery-to-standalone-activity#step-10-when-to-use-a-workflow", "https://docs.temporal.io/evaluate/features/job-queue#resources"]
  v: verified
  ts: true
  note: "Out of scope, flagged as stale: Standalone Activities are now GA, and Ruby and Rust also support them. Update the SDK list."
- id: P-ACT-GRANULARITY
  k: pattern
  t: "Split all-or-nothing state changes into separate activities"
  s: "Reading several sources in one activity is fine; writing to multiple databases or changing state in multiple remote services is an all-or-nothing case that needs separate activities orchestrated by the workflow."
  on: [effect.db_write, effect.payment, effect.http]
  mode: both
  sdk: [all]
  src: ["DOCS", "BPG:11-12,14"]
  url: ["https://temporal.io/blog/how-many-activities-should-i-use-in-my-temporal-workflow"]
  v: verified
- id: P-SAGA
  k: pattern
  t: "Saga: forward steps with reverse-order compensations"
  s: "For multi-service operations that need rollback, register each step's compensation before executing the step, and on failure run compensations in reverse (LIFO) order. Compensations must be idempotent and handle a forward step that never ran."
  on: [reliab.compensation, effect.payment]
  mode: both
  sdk: [all]
  src: ["CRN:24-25", "SKL:core/patterns.md", DOCS]
  v: verified
  note: "Docs say register before execution, not after completion. 'Not for read-only work' is internal guidance only. Revised from: For multi-service operations that need rollback, register a compensation as each step completes and run them in reverse order on failure. Not for read-only or naturally re-runnable work."
  url: ["https://docs.temporal.io/design-patterns/saga-pattern#implementation", "https://docs.temporal.io/design-patterns/saga-pattern#best-practices"]
- id: P-ENTITY
  k: pattern
  t: "Entity workflow models a long-lived stateful thing"
  s: "Subscriptions, carts, sessions, devices: one workflow per entity receives Signals/Updates/Queries over time and uses Continue-As-New to bound history."
  on: [state.diy_status, wait.long, wait.external]
  mode: both
  sdk: [all]
  src: ["CRN:19-20", "SKL:core/patterns.md", DOCS]
  v: verified
  note: "Docs: not a fit for more than 100 updates per second per entity, or for CRUD-only entities."
  url: ["https://docs.temporal.io/design-patterns/entity-workflow", "https://docs.temporal.io/guides/entity-pattern-loyalty-points#background-and-best-practices"]
- id: P-MSG-CHOICE
  k: pattern
  t: "Query to peek, Signal to push, Update to pop"
  s: "Query reads state (sync, read-only, not in history); Signal mutates fire-and-forget; Update mutates and returns a result with optional validation."
  on: [tmp.signal, tmp.query, tmp.update, wait.human]
  mode: both
  sdk: [all]
  src: ["CRN:19", "SKL:core/gotchas.md", DOCS]
  v: verified
  note: "Queries also work on closed Workflows. Updates are slower than Signals and have a small in-flight limit per Workflow."
  url: ["https://docs.temporal.io/evaluate/features/workflow-message-passing", "https://docs.temporal.io/encyclopedia/workflow-message-passing"]
- id: P-POLL-FAST
  k: pattern
  t: "Frequent polling: loop inside one heartbeating activity"
  s: "For polling every second or faster, loop inside a single activity that heartbeats each iteration, with heartbeat timeout shorter than start-to-close. History does not grow."
  on: [wait.poll]
  mode: both
  sdk: [all]
  src: ["CRN:15", "SKL:core/patterns.md", DOCS]
  v: verified
  url: ["https://docs.temporal.io/design-patterns/polling#frequent-polling-fast-response-required"]
- id: P-POLL-SLOW
  k: pattern
  t: "Infrequent polling: use activity retries as the loop"
  s: "For polling once a minute or slower, the activity fails when not done; retry policy with backoff 1.0 and interval equal to the poll period. Retries are not recorded in history."
  on: [wait.poll]
  mode: both
  sdk: [all]
  src: ["CRN:16", "SKL:core/patterns.md", DOCS]
  v: verified
  url: ["https://docs.temporal.io/design-patterns/polling#infrequent-polling-resource-efficient"]
- id: P-POLL-ALT
  k: pattern
  t: "Prefer Signal or async activity completion over polling"
  s: "If the external system can call back, deliver completion by Signal or async activity completion instead of polling."
  on: [wait.poll, wait.external]
  mode: both
  sdk: [all]
  src: ["BPG:12", "SKL:core/patterns.md", DOCS]
  v: verified
  url: ["https://docs.temporal.io/activity-execution#asynchronous-activity-completion", "https://docs.temporal.io/design-patterns/delayed-callback#solution"]
- id: P-TIMER-VS-SCHEDULE
  k: pattern
  t: "Timer for relative waits inside a run; Schedule for recurring starts"
  s: "Use a Timer for waits inside a running Workflow, a Schedule when the same Workflow must run repeatedly, and Start Delay for a single execution at a time known at start. Don't write new Cron Jobs."
  on: [wait.sleep, trigger.cron]
  mode: both
  sdk: [all]
  src: ["BPG:8", DOCS]
  v: verified
  note: 'Docs send one-off delays of a whole execution to Start Delay, not Schedules. Revised from: Use a timer for a relative delay within a workflow; use a Schedule for set times, recurrence, or delaying a whole execution.'
  url: ["https://docs.temporal.io/evaluate/features/schedules#how-to-choose-between-a-schedule-a-cron-job-and-start-delay", "https://docs.temporal.io/workflow-execution/timers-delays"]
- id: P-LISTENER-OUTSIDE
  k: pattern
  t: "Listeners on ports/sockets live outside workflows"
  s: "A process listening on a port or socket runs outside Temporal and starts or notifies workflows with Signal or SignalWithStart."
  on: [trigger.event, trigger.queue]
  mode: both
  sdk: [all]
  src: ["BPG:12", DOCS]
  v: verified
  url: ["https://docs.temporal.io/design-patterns/delayed-callback#solution", "https://docs.temporal.io/design-patterns/signal-with-start"]
- id: P-CLAIM-CHECK
  k: pattern
  t: "Claim check: pass references, activities move the data"
  s: "Store large data externally and pass an identifier; activities fetch, process and store internally and return only a reference."
  on: [data.large, effect.file]
  mode: both
  sdk: [all]
  src: ["DOCS", "BPG:6-7", "SKL:core/patterns.md"]
  url: ["https://docs.temporal.io/best-practices/worker#manage-event-history-growth"]
  v: verified
- id: P-PARTITION
  k: pattern
  t: "Partition large work with Continue-As-New or Child Workflows"
  s: "Bound history by Continue-As-New within one workflow or by partitioning work across child workflows."
  on: [fanout.batch, wait.long]
  mode: both
  sdk: [all]
  src: ["BPG:7,9", "CRN:21", DOCS]
  v: verified
  url: ["https://docs.temporal.io/evaluate/features/child-workflows", "https://docs.temporal.io/design-patterns/batch-processing-patterns"]
- id: P-IDEMPOTENCY
  k: pattern
  t: "Idempotency keys stable across retries"
  s: "Activities run at least once; pass a key that is stable across retries (a business ID, or Workflow Run ID plus Activity ID) to external systems, or check state before acting and use upserts."
  on: [effect.payment, effect.db_write, effect.notify, reliab.idempotency]
  mode: both
  sdk: [all]
  src: ["SKL:core/patterns.md", "BPG:11", "CRN:27", DOCS]
  url: ["https://temporal.io/blog/idempotency-and-durable-execution", "https://docs.temporal.io/activity-definition#idempotency", "https://docs.temporal.io/best-practices/error-handling#idempotence"]
  v: verified
  note: 'Docs recommend Run ID plus Activity ID, not Workflow ID plus activity name. Revised from: Activities run at least once; pass a stable key (workflow ID, business ID, or workflow ID plus activity name) to external systems, or check before acting.'
- id: P-WFID-IDEMPOTENT
  k: pattern
  t: "Business-meaningful Workflow ID doubles as idempotency key"
  s: "Only one open Workflow Execution per Workflow ID per Namespace, so a business ID prevents duplicate concurrent starts. Reuse after close follows the Workflow ID Reuse Policy (default allows duplicates) within the retention period."
  on: [tmp.wf_options, reliab.idempotency, reliab.lock]
  mode: both
  sdk: [all]
  src: ["BPG:9", DOCS]
  v: verified
  note: 'Go SDK default: starting with an open ID returns the existing run instead of an error. Revised from: A Workflow ID cannot be reused while a workflow is open, so a business ID prevents duplicate starts.'
  url: ["https://docs.temporal.io/workflow-execution/workflowid-runid#workflow-id-reuse-policy", "https://docs.temporal.io/workflow-execution/workflowid-runid#workflow-id-conflict-policy"]
- id: P-LLM-ACTIVITY
  k: pattern
  t: "Wrap LLM calls and heavy tools in activities; disable client retries"
  s: "One parameterised call_llm activity, tools with I/O as activities, deterministic agent-state tools in the workflow, and LLM client retries set to zero so Temporal owns retries."
  on: [effect.llm, orch.agent_loop, reliab.retry]
  mode: both
  sdk: [all]
  src: ["SKL:core/ai-patterns.md", DOCS]
  v: verified
  note: "Docs also say to raise non-retryable errors for 4xx such as bad requests or auth failures."
  url: ["https://docs.temporal.io/ai/cookbook/tool-call-openai-python", "https://docs.temporal.io/ai/cookbook/agentic-loop-tool-call-openai-python#create-the-activity-for-llm-invocations"]
- id: P-FAIRNESS
  k: pattern
  t: "Multi-tenant work: fairness keys prevent starvation"
  s: "Without fairness a big tenant's backlog delays small tenants; fairness keys give each tenant a virtual queue served round-robin, optionally weighted."
  on: [tenant.multi, tmp.priority]
  mode: both
  sdk: [all]
  src: ["SKL:core/priority-fairness.md", "BPG:18", DOCS]
  v: verified
  ts: true
  note: "GA in server v1.31.0 per release notes. It is a paid feature in Temporal Cloud."
  url: ["https://docs.temporal.io/develop/task-queue-priority-fairness#task-queue-fairness", "https://docs.temporal.io/design-patterns/fairness", "https://docs.temporal.io/standalone-activity#key-features", "https://docs.temporal.io/develop/task-queue-priority-fairness#how-to-use-fairness"]
- id: P-NEXUS-XNS
  k: pattern
  t: "Cross-namespace or cross-team calls use Nexus"
  s: "Workflows in different namespaces communicate through Nexus; the older way is a client used inside an activity."
  on: [tmp.nexus, tmp.client]
  mode: both
  sdk: [all]
  src: ["BPG:6", DOCS]
  v: verified
  ts: true

# ---------------------------------------------------------------------------
# Limits. Numbers must come from DOCS where possible.
# ---------------------------------------------------------------------------
  note: "Nexus is GA (server v1.27.0). Docs list Activity wrappers with a per-target client as the costlier alternative."
  url: ["https://docs.temporal.io/evaluate/features/nexus", "https://temporal.io/blog/temporal-nexus-now-available"]
limits:
- id: L-HIST-EVENTS
  k: limit
  t: "Event History: warn at 10,240 events, terminate past 51,200"
  s: "The service warns after 10,240 events and terminates the execution past 51,200; aim for a few thousand events per execution."
  on: [tmp.wf_def, wait.long, fanout.batch]
  mode: both
  sdk: [all]
  src: ["DOCS"]
  url: ["https://docs.temporal.io/workflow-execution/event#event-history-limits", "https://docs.temporal.io/best-practices/worker#manage-event-history-growth"]
  v: verified
  ts: true
- id: L-HIST-SIZE
  k: limit
  t: "Event History size: terminate past 50 MB"
  s: "An execution may be terminated if its history exceeds 50 MB; guides recommend acting well before (around 10 MB)."
  on: [data.large, tmp.wf_def]
  mode: both
  sdk: [all]
  src: ["DOCS", "BPG:7", "SKL:core/gotchas.md"]
  url: ["https://docs.temporal.io/best-practices/worker#manage-event-history-growth"]
  v: verified
  ts: true
- id: L-PAYLOAD
  k: limit
  t: "Single payload limit 2 MB"
  s: "Any workflow or activity input or result over 2 MB can terminate the execution."
  on: [data.large]
  mode: both
  sdk: [all]
  src: ["DOCS", "CRN:3"]
  url: ["https://docs.temporal.io/best-practices/worker#manage-event-history-growth"]
  v: verified
  ts: true
- id: L-GRPC
  k: limit
  t: "gRPC message limit 4 MB per workflow task"
  s: "Each gRPC request is limited to 4 MB; scheduling many Activities or Child Workflows, or returning a large result, in one Workflow Task can exceed it, and the Temporal Service then terminates the Workflow Execution."
  on: [fanout.parallel, tmp.local_act]
  mode: eval
  sdk: [all]
  src: ["CRN:14", "SKL:core/gotchas.md", "BPG:9", DOCS]
  v: verified
  ts: true
  note: 'Docs say the execution is terminated, not just rejected. Local Activity results are not named specifically. The limit is the same on Cloud and self-hosted. Revised from: Scheduling many commands or returning many local-activity results in one workflow task can exceed the 4 MB gRPC limit and be rejected.'
  url: ["https://docs.temporal.io/troubleshooting/blob-size-limit-error#grpc-message-size-limit", "https://docs.temporal.io/references/workflow-task-errors#size-limit-errors"]
- id: L-SIGNALS
  k: limit
  t: "Execution terminated past 10,000 Signals"
  s: "An execution is terminated when its history contains more than 10,000 Signals."
  on: [tmp.signal]
  mode: eval
  sdk: [all]
  src: ["DOCS", "BPG:15"]
  url: ["https://docs.temporal.io/workflow-execution/event#event-history-limits"]
  v: verified
  ts: true
- id: L-UPDATES
  k: limit
  t: "Execution terminated past 2,000 Updates"
  s: "An execution is terminated when its history contains more than 2,000 Updates."
  on: [tmp.update]
  mode: eval
  sdk: [all]
  src: ["DOCS"]
  url: ["https://docs.temporal.io/workflow-execution/event#event-history-limits"]
  v: verified
  ts: true
- id: L-CAN-SUGGESTED
  k: limit
  t: "Continue-As-New suggested at about 4K events"
  s: "The SDK continue-as-new-suggested flag turns true as Event History approaches the suggested threshold (about 4,096 Events), well before the hard limits."
  on: [tmp.can]
  mode: eval
  sdk: [all]
  src: ["CRN:20", "DOCS"]
  v: verified
  ts: true
  note: "The 4 MB size trigger appears only in Slack threads, so it is dropped. Revised from: The SDK continue-as-new-suggested flag typically fires around 4,096 events or 4 MB history, well before hard limits."
  url: ["https://docs.temporal.io/guides/entity-pattern-loyalty-points#phase-6-handle-continue-as-new-for-indefinite-execution"]
- id: L-SIGNAL-RATE
  k: limit
  t: "Signal/Update rate per execution is limited"
  s: "Each Signal briefly locks the Workflow Execution; keep the sustained Signal rate below about 5 per second per Workflow Execution, or Workflow Task backlog builds and Continue-As-New can be blocked."
  on: [tmp.signal, tmp.update]
  mode: eval
  sdk: [all]
  src: ["BPG:14-15", "CRN:18-19", DOCS]
  v: verified
  ts: true
  note: "Conflict resolved: docs support BPG's 5/s, and nothing in docs supports 50 RPS. Docs give no separate Update rate, only a cap of 10 in-flight Updates. Revised from: Signals and Updates take the execution lock; a high rate against one execution serializes and stalls progress."
  url: ["https://docs.temporal.io/design-patterns/event-accumulator#best-practices", "https://docs.temporal.io/guides/durable-gaming-sessions#signal-volume-limits"]
- id: L-CHILDREN
  k: limit
  t: "More than 1,000 children per parent is a smell"
  s: "A single parent should not spawn more than 1,000 Child Workflow Executions (guidance, not a hard limit); separately, at most 2,000 incomplete Child Workflows per execution are allowed by default."
  on: [tmp.child, fanout.parallel]
  mode: eval
  sdk: [all]
  src: ["BPG:10-11", DOCS]
  v: verified
  ts: true
  note: "The multi-minute-delay anecdote (BPG, July 2025) is not in docs. Revised from: A parent should not start more than 1,000 children (guidance, not hard limit); hundreds per parent have caused multi-minute delays."
  url: ["https://docs.temporal.io/child-workflows#when-to-use-child-workflows", "https://docs.temporal.io/evaluate/features/child-workflows"]
- id: L-WFT-TIMEOUT
  k: limit
  t: "Workflow Task Timeout default 10 s, max 120 s"
  s: "Workflow Task Timeout defaults to 10 seconds and maxes at 120 seconds; docs advise against raising it. Long Workflow Tasks usually come from blocking Workflow code, large histories or a slow Data Converter."
  on: [tmp.wf_options]
  mode: eval
  sdk: [all]
  src: ["BPG:9", "CRN:4", DOCS]
  v: verified
  ts: true
  note: 'The numbers match. The Java client reference page says the maximum is 60 s, but the encyclopedia and evaluate pages say 120 s. Revised from: Workflow Task Timeout defaults to 10 seconds and maxes at 120 seconds; raising it usually masks I/O in workflow code, large histories or slow codecs.'
  url: ["https://docs.temporal.io/encyclopedia/detecting-workflow-failures#workflow-task-timeout", "https://docs.temporal.io/troubleshooting/execution-failures#workflow-task-execution-latency-high"]
- id: L-DEADLOCK
  k: limit
  t: "Deadlock detector fails tasks blocking 1-2 s without yielding"
  s: "SDK deadlock detection fails a Workflow Task (TMPRL1101) when Workflow code runs more than one or two seconds without yielding; Go and Java default to 1 second."
  on: [tmp.wf_def, hazard.io]
  mode: eval
  sdk: [all]
  src: ["CRN:4", DOCS]
  v: verified
  ts: true
  note: "The pack's 5 s for Python/TS/.NET is wrong. Their errors show 2 s, but only in Slack. Fix the title too. Revised from: Workflow code that blocks longer than the deadlock detector budget fails the task; raising the Workflow Task Timeout does not help."
  url: ["https://docs.temporal.io/troubleshooting/performance-bottlenecks#high-temporal_workflow_task_execution_latency", "https://pkg.go.dev/go.temporal.io/sdk/internal#WorkerOptions"]
- id: L-TIMER-MIN
  k: limit
  t: "Timers under 1 second are not reliable"
  s: "The shortest reliable timer duration is 1 second."
  on: [tmp.timer]
  mode: eval
  sdk: [all]
  src: ["BPG:18", DOCS]
  v: verified
  ts: true
  note: "Docs: durations can be as short as one second, Workflows should not rely on sub-second accuracy, and the duration is a minimum."
  url: ["https://docs.temporal.io/workflow-execution/timers-delays", "https://docs.temporal.io/design-patterns/delayed-callback#when-to-use"]
- id: L-LA-WFT
  k: limit
  t: "Local Activity over 80% of WFT timeout extends the task"
  s: "When a Local Activity passes about 80% of the Workflow Task Timeout, the Worker heartbeats by completing the Workflow Task and requesting a new one; each heartbeat adds Events to history and delays Signal processing."
  on: [tmp.local_act]
  mode: eval
  sdk: [all]
  src: ["CRN:16", DOCS]
  v: verified
  note: "The Worker extends the task, not the server. Docs don't link retrying Local Activities to the 50K limit; they say each backoff retry adds a timer event. Revised from: A local activity running past 80% of the workflow task timeout makes the server schedule extra workflow tasks, appending history; a retrying LA can hit the 50K event limit."
  url: ["https://docs.temporal.io/local-activity", "https://docs.temporal.io/design-patterns/local-activities#common-pitfalls"]
- id: L-HEARTBEAT
  k: limit
  t: "Heartbeats throttled to 0.8 x heartbeat timeout; default 30 s"
  s: "Workers throttle heartbeats to 0.8 x Heartbeat Timeout, or 30 s by default when none is set, capped at 60 s. Without heartbeats, an Activity that dies mid-run isn't detected until Start-To-Close expires."
  on: [tmp.heartbeat]
  mode: eval
  sdk: [all]
  src: ["CRN:26", "BPG:11", DOCS]
  v: verified
  note: "'Server never times out a silent activity' is wrong: Start-To-Close still applies. Revised from: Workers send heartbeats at most every 0.8 x heartbeat timeout (default interval 30 s when unset); without a heartbeat timeout the server never times out a silent activity."
  url: ["https://docs.temporal.io/encyclopedia/detecting-activity-failures#throttling", "https://docs.temporal.io/evaluate/features/job-queue"]
- id: L-VISIBILITY-RPS
  k: limit
  t: "Visibility APIs limited to about 30 RPS"
  s: "Temporal Cloud limits Visibility APIs that list, count or search across executions to 30 calls per second per Namespace, not configurable; single-entity lookups by ID are excluded. Visibility listing is eventually consistent."
  on: [tmp.search_attr]
  mode: eval
  sdk: [all]
  src: ["BPG:21", DOCS]
  v: verified
  ts: true
  note: 'This is a Cloud figure. The eventual-consistency wording comes from the docs on ListSchedules/CountSchedules, which go through Visibility. Revised from: Visibility API calls are rate limited (30 RPS cited) and eventually consistent, so they do not belong in business logic.'
  url: ["https://docs.temporal.io/evaluate/cloud/limits#visibility-api-rate-limit", "https://docs.temporal.io/evaluate/features/schedules"]
- id: L-SCHEDULE-APS
  k: limit
  t: "Schedule requests per second capped per Cloud namespace"
  s: "Temporal Cloud limits Schedules to a default of 10 schedule requests per second per Namespace, raisable via support; use jitter so Schedules don't all start at the same moment."
  on: [tmp.schedule, trigger.cron]
  mode: eval
  sdk: [all]
  src: ["BPG:8,19", DOCS]
  v: verified
  ts: true
  note: "Docs give requests per second (RPS), not actions per second. 'Raisable to 100' is not in docs. Fix the title. Revised from: Total schedule actions per second across a namespace are capped in Temporal Cloud (BPG: default 10, raisable to 100)."
  url: ["https://docs.temporal.io/evaluate/cloud/limits#schedules-rate-limit"]
- id: L-BACKFILL
  k: limit
  t: "Schedule backfill buffer limited to about 1,000 executions"
  s: "Buffered Schedule Actions (BufferAll, including backfills) have an internal safety limit of approximately 1,000 per Schedule by default, varying by deployment; buffered Actions can also expire outside the Catchup Window."
  on: [tmp.schedule]
  mode: eval
  sdk: [all]
  src: ["BPG:19", DOCS]
  v: verified
