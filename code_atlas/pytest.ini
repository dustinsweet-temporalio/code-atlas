[pytest]
testpaths = tests
# Tests import app modules flat (from chat..., from agent ...), as the app runs from this folder.
pythonpath = .
asyncio_mode = auto
# One Temporal test server (a session fixture) serves every async test.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: needs a running Temporal server and Redis (set CHAT_INTEGRATION=1)
